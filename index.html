<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 추천 갤러리</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Pretendard:wght@400;500;600;700;800&display=swap');

  @font-face{
    font-family:'Pretendard Fallback';
    src:local('Malgun Gothic'),local('Apple SD Gothic Neo');
  }

  :root{
    --bg:#0a0e14;
    --panel:#12171f;
    --panel2:#161c26;
    --border:#20293a;
    --text:#e9eef5;
    --sub:#7d8ba0;
    --accent:#66c0f4;
    --accent2:#ff2d6f;
    --gold:#ffd60a;

    --font-display:'Rajdhani','Pretendard','Pretendard Fallback',sans-serif;
    --font-body:'Pretendard','Pretendard Fallback',system-ui,-apple-system,sans-serif;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    padding:32px 16px 100px;
    background:
      radial-gradient(
        ellipse 900px 500px at 50% -10%,
        rgba(102,192,244,.08),
        transparent 60%
      ),
      var(--bg);

    color:var(--text);
    font-family:var(--font-body);
  }

  .wrap{
    max-width:860px;
    margin:0 auto;
  }

  /* 헤더 */

  .appHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
    flex-wrap:wrap;
    gap:10px;
  }

  h1{
    font-family:var(--font-display);
    font-size:24px;
    font-weight:700;
    margin:0;
    display:flex;
    align-items:center;
    gap:9px;
  }

  .sub{
    color:var(--sub);
    font-size:13.5px;
    margin-bottom:22px;
  }

  .lockBtn{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--sub);
    border-radius:8px;
    padding:9px 13px;
    font-size:15px;
    cursor:pointer;
  }

  .lockBtn:hover{
    color:var(--accent);
    border-color:var(--accent);
  }

  .lockBtn.unlocked{
    color:var(--gold);
    border-color:var(--gold);
  }


  /* 관리자 */

  .adminCard{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:22px;
    display:none;
    position:relative;
    overflow:hidden;
  }

  .adminCard::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:2px;
    background:linear-gradient(
      90deg,
      var(--gold),
      var(--accent2)
    );
  }

  .adminCard.show{
    display:block;
  }

  .adminCard h3{
    font-family:var(--font-display);
    font-size:15px;
    margin:0 0 14px;
    color:var(--gold);
  }

  label{
    font-family:var(--font-display);
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.5px;
    color:var(--sub);
    display:block;
    margin-bottom:6px;
    text-transform:uppercase;
  }

  input[type=text],
  input[type=password]{
    width:100%;
    background:#04060a;
    color:var(--accent);
    border:1px solid var(--border);
    border-radius:6px;
    font-size:13.5px;
    padding:10px 12px;
    font-family:'Rajdhani',monospace;
  }

  input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(102,192,244,.12);
  }

  .formRow{
    display:flex;
    gap:10px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }

  .formRow > div{
    flex:1;
    min-width:160px;
  }

  button{
    cursor:pointer;
    border:none;
    border-radius:6px;
    font-weight:700;
    font-size:13px;
    padding:10px 18px;
    font-family:var(--font-body);
  }

  .btnPrimary{
    background:var(--accent);
    color:#04121c;
    font-weight:800;
  }

  .btnGhost{
    background:var(--panel2);
    color:var(--text);
    border:1px solid var(--border);
  }

  .btnGhost:hover{
    border-color:var(--accent);
    color:var(--accent);
  }

  .err{
    color:var(--accent2);
    font-size:12px;
    margin-top:8px;
    display:none;
  }

  .adminListItem{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid #1a212e;
    font-size:12.5px;
  }

  .adminListItem:last-child{
    border-bottom:none;
  }

  .adminListItem .aTitle{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .adminListItem .delBtn{
    background:none;
    color:var(--sub);
    font-size:14px;
    padding:2px 6px;
  }

  .adminListItem .delBtn:hover{
    color:var(--accent2);
  }


  /* 관리자 PIN */

  .pinModalBg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(4,6,10,.8);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  .pinModalBg.open{
    display:flex;
  }

  .pinModalBox{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
    max-width:320px;
    width:100%;
  }

  .pinModalBox h3{
    font-family:var(--font-display);
    font-size:15px;
    margin:0 0 12px;
  }


  /* 게임 갤러리 */

  .gameGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:16px;
  }

  .gameCard{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    text-decoration:none;
    color:var(--text);
    transition:transform .15s ease, border-color .15s ease;
    display:block;
  }

  .gameCard:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
  }

  .gameCard .thumb{
    width:100%;
    aspect-ratio:460/215;
    object-fit:cover;
    background:#0d1119;
    display:block;
  }

  .gameCard .info{
    padding:12px 14px;
  }

  .gameCard .gTitle{
    font-weight:700;
    font-size:13.5px;
    margin-bottom:4px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .gameCard .gBy{
    font-size:11.5px;
    color:var(--sub);
  }

  .gameCard .gBy b{
    color:var(--accent);
  }

  .emptyMsg{
    text-align:center;
    color:var(--sub);
    font-size:13.5px;
    padding:50px 0;
    grid-column:1/-1;
  }

</style>

</head>

<body>

<div class="wrap">

  <div class="appHeader">
    <h1>🎮 게임 추천 갤러리</h1>

```
<button
  class="lockBtn"
  id="lockBtn"
  title="관리자 모드"
>
  🔒
</button>
```

  </div>

  <div class="sub">
    사람들이 추천해준 스팀 게임들을 모아봤어요.
  </div>

  <!-- 관리자 -->

  <div class="adminCard" id="adminCard">

```
<h3>⚙️ 관리자 모드 — 게임 추가</h3>

<div class="formRow">

  <div>
    <input
      id="byInput"
      type="text"
      placeholder="추천한 사람 이름"
    >
  </div>

  <div>
    <input
      id="urlInput"
      type="text"
      placeholder="스팀 게임 URL (store.steampowered.com/app/...)"
    >
  </div>

</div>

<button class="btnPrimary" id="addBtn">
  추가
</button>

<div class="err" id="addErr"></div>


<div style="margin-top:18px;">

  <label>
    등록된 게임 (관리용 — 삭제 가능)
  </label>

  <div id="adminList"></div>

</div>
```

  </div>

  <!-- 게임 목록 -->

  <div class="gameGrid" id="gameGrid">

```
<div class="emptyMsg">
  불러오는 중...
</div>
```

  </div>

</div>

<!-- PIN 입력창 -->

<div class="pinModalBg" id="pinModalBg">

  <div class="pinModalBox">

```
<h3>🔒 관리자 PIN 입력</h3>

<input
  id="pinInput"
  type="password"
  placeholder="PIN 번호"
>

<div class="err" id="pinErr"></div>


<div style="display:flex;gap:8px;margin-top:14px;">

  <button
    class="btnPrimary"
    id="pinSubmitBtn"
    style="flex:1;"
  >
    확인
  </button>

  <button
    class="btnGhost"
    id="pinCancelBtn"
  >
    취소
  </button>

</div>
```

  </div>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

/* =====================================================
   관리자 PIN
===================================================== */

const ADMIN_PIN = '1234';



/* =====================================================
   Firebase 설정
===================================================== */

const firebaseConfig = {

  apiKey: "AIzaSyClUo4m0Rlsd48K6R4UgsZdEpq3ojJVbBA",

  authDomain: "steam-picks.firebaseapp.com",

  databaseURL:
    "https://steam-picks-default-rtdb.firebaseio.com",

  projectId: "steam-picks",

  storageBucket:
    "steam-picks.firebasestorage.app",

  messagingSenderId:
    "939715595783",

  appId:
    "1:939715595783:web:1bbdf1aca6bfe5dc7d64a2"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.database();


let IS_ADMIN = false;

let GAMES = {};



/* =====================================================
   HTML 문자 보호
===================================================== */

function escapeHtml(s){

  const d = document.createElement('div');

  d.textContent = s || '';

  return d.innerHTML;

}



/* =====================================================
   Steam App ID 추출
===================================================== */

function extractAppId(url){

  const m = url.match(
    /store\.steampowered\.com\/app\/(\d+)/
  );

  return m ? m[1] : null;

}



/* =====================================================
   URL에서 게임 제목 추출
===================================================== */

function extractTitleFromUrl(url, appid){

  const m = url.match(
    /store\.steampowered\.com\/app\/\d+\/([^/?]+)/
  );

  if(m){

    return decodeURIComponent(m[1])
      .replace(/_/g, ' ');

  }

  return appid
    ? ('앱 ' + appid)
    : url;

}



/* =====================================================
   Steam 대표 이미지
===================================================== */

function steamHeaderImg(appid){

  return (
    'https://cdn.akamai.steamstatic.com/steam/apps/'
    + appid
    + '/header.jpg'
  );

}



/* =====================================================
   게임 갤러리 렌더링

   가격 기능 완전 제거
   이미지 + 게임 제목 + 추천인만 표시
===================================================== */

function renderGallery(){

  const grid =
    document.getElementById('gameGrid');


  const entries =
    Object.entries(GAMES)
      .sort(
        (a, b) =>
          (b[1].addedAt || 0)
          -
          (a[1].addedAt || 0)
      );


  grid.innerHTML = '';


  if(entries.length === 0){

    grid.innerHTML =
      '<div class="emptyMsg">' +
      '아직 등록된 게임이 없어요.' +
      '</div>';

    return;

  }



  entries.forEach(([gid, g]) => {


    const card =
      document.createElement('a');


    card.className = 'gameCard';


    card.href = g.url;


    card.target = '_blank';


    card.rel =
      'noopener noreferrer';



    /*
      이미지 주소

      1. Firebase에 저장된 기존 이미지
      2. Steam Akamai Header
      3. Steam Cloudflare Header
      4. Capsule 이미지
      5. 세로 Library 이미지
    */

    const fallbacks = [];


    if(g.img){

      fallbacks.push(g.img);

    }


    fallbacks.push(

      'https://cdn.akamai.steamstatic.com/steam/apps/'
      + g.appid
      + '/header.jpg',

      'https://cdn.cloudflare.steamstatic.com/steam/apps/'
      + g.appid
      + '/header.jpg',

      'https://cdn.akamai.steamstatic.com/steam/apps/'
      + g.appid
      + '/capsule_616x353.jpg',

      'https://cdn.akamai.steamstatic.com/steam/apps/'
      + g.appid
      + '/library_600x900.jpg'

    );



    card.innerHTML = `

      <img
        class="thumb"
        src="${escapeHtml(fallbacks[0])}"
        alt="${escapeHtml(g.title)}"
        data-fallbacks='${JSON.stringify(fallbacks)}'
        data-fallback-idx="0"
        loading="lazy"
      >

      <div class="info">

        <div class="gTitle">
          ${escapeHtml(g.title)}
        </div>

        <div class="gBy">
          <b>${escapeHtml(g.by)}</b> 님 추천
        </div>

      </div>

    `;



    /*
      이미지가 안 나오면
      다음 Steam 이미지 주소를 자동으로 시도
    */

    const img =
      card.querySelector('img');


    img.addEventListener(
      'error',

      function(){

        const list =
          JSON.parse(
            this.dataset.fallbacks
          );


        const idx =
          parseInt(
            this.dataset.fallbackIdx,
            10
          )
          \+ 1;



        if(idx < list.length){

          this.dataset.fallbackIdx = idx;

          this.src = list[idx];

        }

        else{

          this.style.display = 'none';

        }

      }

    );



    grid.appendChild(card);


  });

}



/* =====================================================
   관리자 목록
===================================================== */

function renderAdminList(){


  const list =
    document.getElementById('adminList');


  const entries =
    Object.entries(GAMES)
      .sort(
        (a, b) =>
          (b[1].addedAt || 0)
          -
          (a[1].addedAt || 0)
      );


  list.innerHTML = '';



  if(entries.length === 0){

    list.innerHTML =
      '<div style="font-size:12px;color:var(--sub);">' +
      '등록된 게임이 없어요.' +
      '</div>';

    return;

  }



  entries.forEach(([gid, g]) => {


    const el =
      document.createElement('div');


    el.className =
      'adminListItem';


    el.innerHTML = `

      <span class="aTitle">

        ${escapeHtml(g.title)}
        —
        ${escapeHtml(g.by)}

      </span>


      <button
        class="delBtn"
        data-id="${escapeHtml(gid)}"
        title="삭제"
      >
        ✕
      </button>

    `;


    list.appendChild(el);


  });



  list
    .querySelectorAll('.delBtn')
    .forEach(btn => {


      btn.addEventListener(

        'click',

        () => {

          db
            .ref(
              'games/'
              + btn.getAttribute('data-id')
            )
            .remove();

        }

      );


    });

}



/* =====================================================
   Firebase 실시간 데이터 불러오기
===================================================== */

db
  .ref('games')
  .on(
    'value',

    (snapshot) => {


      GAMES =
        snapshot.val() || {};


      renderGallery();


      if(IS_ADMIN){

        renderAdminList();

      }


    }

  );



/* =====================================================
   게임 추가
===================================================== */

function addGame(){


  const by =
    document
      .getElementById('byInput')
      .value
      .trim();


  const url =
    document
      .getElementById('urlInput')
      .value
      .trim();


  const errEl =
    document.getElementById('addErr');


  errEl.style.display =
    'none';



  if(!by){

    errEl.textContent =
      '추천한 사람 이름을 입력해주세요.';

    errEl.style.display =
      'block';

    return;

  }



  const appid =
    extractAppId(url);



  if(!appid){

    errEl.textContent =
      'store.steampowered.com/app/숫자/... 형태의 스팀 URL을 넣어주세요.';

    errEl.style.display =
      'block';

    return;

  }



  const title =
    extractTitleFromUrl(
      url,
      appid
    );


  const img =
    steamHeaderImg(appid);



  const newRef =
    db.ref('games').push();



  newRef.set({

    by: by,

    url: url,

    appid: appid,

    title: title,

    img: img,

    addedAt:
      firebase.database
        .ServerValue
        .TIMESTAMP

  });



  document
    .getElementById('byInput')
    .value = '';


  document
    .getElementById('urlInput')
    .value = '';

}



/* =====================================================
   관리자 PIN
===================================================== */

function openPinModal(){


  document
    .getElementById('pinInput')
    .value = '';


  document
    .getElementById('pinErr')
    .style.display = 'none';


  document
    .getElementById('pinModalBg')
    .classList
    .add('open');


  document
    .getElementById('pinInput')
    .focus();

}



function closePinModal(){

  document
    .getElementById('pinModalBg')
    .classList
    .remove('open');

}



function submitPin(){


  const val =
    document
      .getElementById('pinInput')
      .value;



  if(val === ADMIN_PIN){


    IS_ADMIN = true;


    document
      .getElementById('adminCard')
      .classList
      .add('show');


    document
      .getElementById('lockBtn')
      .textContent = '🔓';


    document
      .getElementById('lockBtn')
      .classList
      .add('unlocked');


    renderAdminList();


    closePinModal();


  }


  else{


    const err =
      document
        .getElementById('pinErr');


    err.textContent =
      'PIN이 틀렸어요.';


    err.style.display =
      'block';


  }

}



/* =====================================================
   이벤트
===================================================== */

document
  .getElementById('lockBtn')
  .addEventListener(

    'click',

    () => {


      if(IS_ADMIN){


        IS_ADMIN = false;


        document
          .getElementById('adminCard')
          .classList
          .remove('show');


        document
          .getElementById('lockBtn')
          .textContent = '🔒';


        document
          .getElementById('lockBtn')
          .classList
          .remove('unlocked');


      }


      else{


        openPinModal();


      }


    }

  );



document
  .getElementById('pinSubmitBtn')
  .addEventListener(
    'click',
    submitPin
  );



document
  .getElementById('pinInput')
  .addEventListener(

    'keydown',

    (e) => {

      if(e.key === 'Enter'){

        submitPin();

      }

    }

  );



document
  .getElementById('pinCancelBtn')
  .addEventListener(
    'click',
    closePinModal
  );



document
  .getElementById('pinModalBg')
  .addEventListener(

    'click',

    (e) => {

      if(
        e.target.id
        ===
        'pinModalBg'
      ){

        closePinModal();

      }

    }

  );



document
  .getElementById('addBtn')
  .addEventListener(
    'click',
    addGame
  );



document
  .getElementById('urlInput')
  .addEventListener(

    'keydown',

    (e) => {

      if(e.key === 'Enter'){

        addGame();

      }

    }

  );

</script>

</body>
</html>
