<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEAM 게임 추천 리스트</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0e14">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Pretendard:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#0a0e14;--panel:#12171f;--panel2:#161c26;--border:#20293a;--text:#e9eef5;
  --sub:#7d8ba0;--accent:#66c0f4;--accent2:#ff2d6f;--gold:#ffd60a;
  --font-display:'Rajdhani','Pretendard',sans-serif;--font-body:'Pretendard',system-ui,sans-serif;
  --bg-image:url("bg.gif");
}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px 100px;background-image:var(--bg-image),radial-gradient(ellipse 900px 500px at 50% -10%,rgba(102,192,244,.08),transparent 60%);background-color:var(--bg);background-size:cover,auto;background-position:center,center;background-attachment:fixed,scroll;background-repeat:no-repeat,no-repeat;color:var(--text);font-family:var(--font-body);min-height:100vh}
.wrap{max-width:900px;margin:0 auto}
.appHeader{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
h1{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0;display:flex;align-items:center;gap:9px}
.titleLogo{width:27px;height:27px;object-fit:contain;display:block}
.lockBtn{background:var(--panel2);border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:8px 14px;font-size:17px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.lockBtn .lockText{font-family:var(--font-display);font-size:9.5px;letter-spacing:.5px}
.lockBtn:hover{color:var(--accent);border-color:var(--accent)}.lockBtn.unlocked{color:var(--gold);border-color:var(--gold)}
.adminCard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:22px;display:none;position:relative;overflow:hidden}
.adminCard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--accent2))}
.adminCard.show{display:block}.adminCard h3{font-family:var(--font-display);font-size:15px;margin:0 0 14px;color:var(--gold)}
.adminCard h4{font-family:var(--font-display);font-size:12.5px;margin:18px 0 10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-top:1px solid #1a212e;padding-top:14px}
label{font-family:var(--font-display);font-size:11.5px;font-weight:600;letter-spacing:.5px;color:var(--sub);display:block;margin-bottom:6px;text-transform:uppercase}
input[type=text],input[type=password],input[type=number],input[type=url]{width:100%;background:#04060a;color:var(--accent);border:1px solid var(--border);border-radius:6px;font-size:13.5px;padding:10px 12px;font-family:'Rajdhani',monospace}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(102,192,244,.12)}
.formRow{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.formRow>div{flex:1;min-width:150px}
button{cursor:pointer;border:none;border-radius:6px;font-weight:700;font-size:13px;padding:10px 18px;font-family:var(--font-body)}
.btnPrimary{background:var(--accent);color:#04121c;font-weight:800}.btnDanger{background:rgba(255,45,111,.12);border:1px solid rgba(255,45,111,.45);color:var(--accent2)}
.btnGhost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}.btnGhost:hover{border-color:var(--accent);color:var(--accent)}
.err{color:var(--accent2);font-size:12px;margin-top:8px;display:none}.checkRow{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px}.checkRow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.adminColumns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.adminColumns .colHead{font-family:var(--font-display);font-size:11px;letter-spacing:.5px;color:var(--sub);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}.adminColumns .colHead .cnt{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:1px 7px;font-size:10.5px}
.adminListItem{display:flex;align-items:center;gap:8px;padding:11px 10px;border:1px solid transparent;border-bottom-color:#1a212e;font-size:12.5px;cursor:pointer;border-radius:7px;transition:.15s}.adminListItem:hover{background:var(--panel2);border-color:var(--border)}.adminListItem .aTitle{flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adminListItem.played .aTitle{color:var(--sub);text-decoration:line-through}.adminListItem .arrow{color:var(--sub)}
@media(max-width:560px){.adminColumns{grid-template-columns:1fr}}
.modalBg{display:none;position:fixed;inset:0;background:rgba(4,6,10,.84);z-index:9999;align-items:center;justify-content:center;padding:20px;overflow:auto}.modalBg.open{display:flex}
.modalBox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:720px;width:100%;max-height:92vh;overflow:auto}.smallModal{max-width:360px}
.modalBox h3{font-family:var(--font-display);font-size:17px;margin:0 0 16px}.modalTitleRow{display:flex;justify-content:space-between;gap:10px;align-items:center}.closeX{background:none;color:var(--sub);font-size:20px;padding:2px 7px}
.managePreview{display:flex;gap:14px;padding-bottom:15px;margin-bottom:16px;border-bottom:1px solid #1a212e}.managePreview img{width:170px;aspect-ratio:460/215;object-fit:cover;border-radius:7px;background:#0d1119}.managePreviewInfo{min-width:0;flex:1}.managePreviewTitle{font-weight:800;font-size:16px;margin-bottom:6px;word-break:break-word}.managePreviewSub{font-size:11px;color:var(--sub);line-height:1.7}
.manageActions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.manageActions button{padding:9px 12px}
.sectionTitle{font-family:var(--font-display);font-size:12px;color:var(--gold);letter-spacing:.5px;margin:16px 0 9px;padding-top:14px;border-top:1px solid #1a212e}
.filterRow{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.filterRow input{flex:2;min-width:160px}.filterRow select{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:10px 12px;font-size:13px}
.gameGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.gameCard{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--text);display:block;isolation:isolate;transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .28s ease}
/* 테두리에만 딱 붙는 그라데이션 링 — 회전 없이 페이드인만 */
.gameCard::after{content:'';position:absolute;inset:0;border-radius:10px;padding:2px;pointer-events:none;z-index:1;opacity:0;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--gold));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transition:opacity .2s ease}
.gameCard .thumb{transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .35s ease}
.gameCard:hover{transform:translateY(-4px)}
.gameCard:hover::after{opacity:1}
.gameCard:hover .thumb{transform:scale(1.04);filter:brightness(1.08) saturate(1.1)}
.gameCard.played{opacity:1}.gameCard .playedBadge{position:absolute;top:8px;right:8px;background:var(--accent2);color:#fff;font-size:13px;font-weight:800;padding:4px 10px;border-radius:5px;font-family:var(--font-display);letter-spacing:.5px;z-index:2}
.gameCard .thumb{width:100%;aspect-ratio:460/215;object-fit:cover;background:#0d1119;display:block}.gameCard .info{padding:12px 14px}.gameCard .gTitle{font-weight:700;font-size:13.5px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gameCard .recBadge{position:absolute;top:8px;left:8px;background:rgba(4,6,10,.75);color:var(--accent);font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:6px;z-index:2;backdrop-filter:blur(2px);border:1px solid rgba(102,192,244,.4)}
.gameCard .genreTags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}.gameCard .genreTag{font-size:9.5px;background:var(--panel2);border:1px solid var(--border);color:var(--sub);padding:2px 6px;border-radius:4px;font-family:var(--font-display)}
.gameCard .ratingLine{margin-top:6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ratingBadge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;font-family:var(--font-display);border:1px solid;white-space:nowrap}
.ratingBadge.rt-positive{color:#7ee08a;border-color:rgba(126,224,138,.45);background:rgba(126,224,138,.09)}
.ratingBadge.rt-mixed{color:var(--gold);border-color:rgba(255,214,10,.45);background:rgba(255,214,10,.09)}
.ratingBadge.rt-negative{color:var(--accent2);border-color:rgba(255,45,111,.45);background:rgba(255,45,111,.09)}
.ratingBadge.rt-none{color:var(--sub);border-color:var(--border);background:rgba(125,139,160,.08)}
.metaBadge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;font-family:var(--font-display);border:1px solid;white-space:nowrap}
.metaBadge.mc-high{color:#7ee08a;border-color:rgba(126,224,138,.45);background:rgba(126,224,138,.09)}
.metaBadge.mc-mid{color:var(--gold);border-color:rgba(255,214,10,.45);background:rgba(255,214,10,.09)}
.metaBadge.mc-low{color:var(--accent2);border-color:rgba(255,45,111,.45);background:rgba(255,45,111,.09)}
.gameCard .priceLine{margin-top:8px;padding-top:8px;border-top:1px solid #1a212e;font-family:var(--font-display);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.priceOrig{font-size:11.5px;color:var(--sub);text-decoration:line-through}.priceFinal{font-size:14px;font-weight:700;color:var(--gold)}.priceFree{font-size:13px;font-weight:700;color:var(--accent)}.priceEnd{font-size:10.5px;color:var(--accent2)}.discountBadge{background:var(--accent2);color:#fff;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:4px}
.emptyMsg{text-align:center;color:var(--sub);font-size:13.5px;padding:50px 0;grid-column:1/-1}.verTag{font-size:10px;color:#3a4456;margin-bottom:18px;font-family:var(--font-display)}
#scrollTopBtn{position:fixed;right:18px;bottom:24px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#04121c;font-size:18px;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(102,192,244,.35);z-index:500;padding:0;line-height:1}#scrollTopBtn.show{display:flex}
@media(max-width:600px){.managePreview{flex-direction:column}.managePreview img{width:100%}.modalBox{padding:17px}.manageActions button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="appHeader">
    <h1><svg class="titleLogo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#171a21"/><circle cx="12" cy="12" r="11" fill="none" stroke="#66c0f4" stroke-width="1.2"/><circle cx="8.4" cy="15.2" r="2.1" fill="none" stroke="#66c0f4" stroke-width="1.3"/><circle cx="8.4" cy="15.2" r="0.7" fill="#66c0f4"/><path d="M9.9 13.9 L14.3 10.3" stroke="#66c0f4" stroke-width="1.2"/><circle cx="15.4" cy="9.3" r="2.5" fill="none" stroke="#ffd60a" stroke-width="1.3"/><circle cx="15.4" cy="9.3" r="0.8" fill="#ffd60a"/></svg> STEAM 게임 추천 리스트</h1>
    <button class="lockBtn" id="lockBtn" title="관리자 모드"><span id="lockIcon">🔒</span><span class="lockText">관리자 모드</span></button>
  </div>
  <div class="verTag">버전: 2026-09-01 v16 (추천인 필터, 공유 추가, 가격·할인·할인종료일 자동 수집)</div>

  <div class="adminCard" id="adminCard">
    <h3>⚙️ 관리자 모드 — 게임 추가</h3>
    <div class="formRow"><div><input id="byInput" type="text" placeholder="추천한 사람 이름"></div><div><input id="urlInput" type="text" placeholder="스팀 게임 URL (store.steampowered.com/app/...)"></div></div>
    <div style="font-size:11.5px;color:var(--sub);margin:-4px 0 14px">💡 가격·할인 정보는 스팀에서 자동으로 가져와요. 안 맞으면 추가 후 "가격 수정"으로 고칠 수 있어요.</div>
    <button class="btnPrimary" id="addBtn">추가</button><div class="err" id="addErr"></div>
  </div>
<div class="filterRow"><input id="searchInput" type="text" placeholder="🔍 게임 이름 검색..."><select id="genreFilter"><option value="">전체 장르</option></select><select id="byFilter"><option value="">전체 추천인</option></select></div>
  <div class="gameGrid" id="gameGrid"><div class="emptyMsg">불러오는 중...</div></div>
</div>
<button id="scrollTopBtn" title="맨 위로">↑</button>

<div class="modalBg" id="pinModalBg"><div class="modalBox smallModal"><h3>🔒 관리자 PIN 입력</h3><input id="pinInput" type="password" placeholder="PIN 번호"><div class="err" id="pinErr"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btnPrimary" id="pinSubmitBtn" style="flex:1">확인</button><button class="btnGhost" id="pinCancelBtn">취소</button></div></div></div>

<div class="modalBg" id="manageModalBg"><div class="modalBox">
  <div class="modalTitleRow">
    <h3 id="manageModalTitle">🎮 게임 관리</h3>
    <button class="closeX" data-close="manageModalBg">×</button>
  </div>

  <!-- 게임 관리 메인 화면 -->
  <div id="manageMainView">
    <div class="managePreview">
      <img id="managePreviewImg" alt="">
      <div class="managePreviewInfo">
        <div class="managePreviewTitle" id="managePreviewTitle"></div>
        <div class="managePreviewSub" id="managePreviewInfo"></div>
      </div>
    </div>

    <div class="manageActions">
      <button class="btnPrimary" id="managePlayedBtn">플레이 완료</button>
      <button class="btnGhost" id="managePriceBtn">💰 가격 수정</button>
      <button class="btnGhost" id="manageRefreshBtn">🔄 정보 새로고침</button>
      <button class="btnGhost" id="manageOpenBtn">↗ 스팀 링크 열기</button>
      <button class="btnDanger" id="manageDeleteBtn">삭제</button>
    </div>

    <div class="sectionTitle">기본 정보 수정</div>
    <div class="formRow">
      <div><label>게임 이름</label><input id="manageTitleInput" type="text"></div>
      <div><label>추천한 사람</label><input id="manageByInput" type="text"></div>
    </div>
    <div class="formRow">
      <div><label>스팀 링크</label><input id="manageUrlInput" type="url"></div>
    </div>
    <div class="formRow">
      <div><label>장르 (쉼표로 구분)</label><input id="manageGenresInput" type="text"></div>
    </div>
    <div style="display:flex;justify-content:flex-end">
      <button class="btnPrimary" id="manageSaveBtn">기본 정보 저장</button>
    </div>
    <div class="err" id="manageErr"></div>
  </div>

  <!-- 같은 관리창 안에서 전환되는 가격 수정 화면 -->
  <div id="managePriceView" style="display:none">
    <div class="sectionTitle" style="margin-top:0">가격 수정</div>

    <div class="checkRow">
      <input type="checkbox" id="editFreeCheck">
      <label style="margin:0" for="editFreeCheck">무료 게임</label>
    </div>

    <div id="editPriceSection">
      <label>가격 (₩) — 할인 없을 때</label>
      <div class="formRow">
        <div><input id="editPriceBaseInput" type="number" placeholder="가격"></div>
      </div>

      <div class="checkRow">
        <input type="checkbox" id="editOnSaleCheck">
        <label style="margin:0" for="editOnSaleCheck">할인 중</label>
      </div>

      <div class="formRow" id="editSaleFields" style="display:none">
        <div><input id="editPriceOrigInput" type="number" placeholder="원가"></div>
        <div><input id="editPriceNowInput" type="number" placeholder="할인가"></div>
        <div><input id="editPriceEndInput" type="text" placeholder="할인 종료일 (예: 9/8일까지)"></div>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btnPrimary" id="priceSaveBtn" style="flex:1">가격 저장</button>
      <button class="btnGhost" id="priceCancelBtn">← 관리창으로</button>
    </div>
  </div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const ADMIN_PIN='388rhdqn';
const firebaseConfig={apiKey:"AIzaSyClUo4m0Rlsd48K6R4UgsZdEpq3ojJVbBA",authDomain:"steam-picks.firebaseapp.com",databaseURL:"https://steam-picks-default-rtdb.firebaseio.com",projectId:"steam-picks",storageBucket:"steam-picks.firebasestorage.app",messagingSenderId:"939715595783",appId:"1:939715595783:web:1bbdf1aca6bfe5dc7d64a2"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let IS_ADMIN=false,GAMES={},CURRENT_EDIT_ID=null,CURRENT_MANAGE_ID=null;
function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function extractAppId(url){const m=(url||'').match(/store\.steampowered\.com\/app\/(\d+)/i);return m?m[1]:null}
function extractTitleFromUrl(url,appid){const m=(url||'').match(/store\.steampowered\.com\/app\/\d+\/([^/?]+)/i);if(m){try{return decodeURIComponent(m[1]).replace(/_/g,' ')}catch(e){return m[1].replace(/_/g,' ')}}return appid?'앱 '+appid:url}
function steamHeaderImg(appid){
  return 'https://shared.steamstatic.com/store_item_assets/steam/apps/'+appid+'/header.jpg'
}
function withTimeout(p,ms){
  return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))])
}
async function fetchJSON(url,ms=8500){
  const r=await withTimeout(fetch(url,{cache:'no-store'}),ms);
  if(!r.ok)throw new Error('HTTP '+r.status);
  let j=await r.json();
  if(j&&typeof j.contents==='string')j=JSON.parse(j.contents);
  return j
}
async function fetchText(url,ms=8500){
  const r=await withTimeout(fetch(url,{cache:'no-store'}),ms);
  if(!r.ok)throw new Error('HTTP '+r.status);
  let t=await r.text();
  try{
    const j=JSON.parse(t);
    if(j&&typeof j.contents==='string')t=j.contents;
  }catch(e){}
  return t
}
function cleanSteamTitle(title){
  return (title||'').replace(/^Steam의\s*/,'').replace(/^Steam\s*-\s*/,'').replace(/\s+on\s+Steam$/i,'').trim()
}
function uniqueGenres(list){
  const seen=new Set(),out=[];
  list.forEach(v=>{
    const x=(typeof v==='string'?v:(v&&v.description)||'').trim();
    const k=x.toLowerCase();
    if(x&&!seen.has(k)){seen.add(k);out.push(x)}
  });
  return out
}
function limitGenres(list,max=6){return uniqueGenres(list).slice(0,max)}
function genresFromText(text){
  if(!text)return [];
  return text.split(/[,/|]/).map(x=>x.trim()).filter(Boolean)
}
function parseSteamPage(text){
  const doc=new DOMParser().parseFromString(text,'text/html');
  const title=cleanSteamTitle(doc.querySelector('meta[property="og:title"]')?.content||'');
  const img=doc.querySelector('meta[property="og:image"]')?.content||'';
  // 태그(/tags/)는 장르가 아니므로 절대 수집하지 않습니다.
  const genres=[...doc.querySelectorAll('.details_block a[href*="/genre/"]')]
    .map(x=>x.textContent.trim()).filter(Boolean);
  return {name:title,header_image:img,genres:limitGenres(genres).map(description=>({description}))}
}
async function collectAll(tasks){
  const r=await Promise.allSettled(tasks.map(fn=>fn()));
  return r.filter(x=>x.status==='fulfilled'&&x.value).map(x=>x.value)
}

// 평가(리뷰 요약) / 메타크리틱 표시 관련 헬퍼
const REVIEW_DESC_KO={
  'Overwhelmingly Positive':'압도적으로 긍정적',
  'Very Positive':'매우 긍정적',
  'Positive':'긍정적',
  'Mostly Positive':'대체로 긍정적',
  'Mixed':'복합적',
  'Mostly Negative':'대체로 부정적',
  'Negative':'부정적',
  'Very Negative':'매우 부정적',
  'Overwhelmingly Negative':'압도적으로 부정적'
};
function reviewTier(score){
  score=+score||0;
  if(score>=7)return 'positive';
  if(score>=5)return 'mixed';
  if(score>=1)return 'negative';
  return 'none'
}
function metacriticTier(score){
  score=+score||0;
  if(score>=75)return 'high';
  if(score>=50)return 'mid';
  return 'low'
}
function reviewBadgeText(review){
  if(!review)return '';
  const raw=review.desc||'';
  const isCountOnly=/user reviews?/i.test(raw)||!raw;
  const label=REVIEW_DESC_KO[raw]||(isCountOnly?'':raw);
  if(!label)return '';
  const pct=(review.total>0)?Math.round((review.positive/review.total)*100):null;
  return pct!=null?label+' ('+pct+'%)':label
}

/*
 가격 자동 수집:
 - 정가/할인가/할인율은 appdetails의 price_overview에서 가져옵니다(공식 필드, 안정적).
   KRW는 소수점이 없는 통화라 100으로 나누지 않고 그대로 원화로 씁니다.
 - 할인 종료일은 공식 문서에 없는 필드라, 스팀의 신형(비공식) 스토어 API에서
   best-effort로만 시도합니다. 실패하거나 값이 없으면 그냥 빈 값으로 둬서
   관리자가 "가격 수정"에서 직접 채울 수 있게 합니다.
*/
function wonFromSteamPrice(amount,currency){
  if(amount==null)return 0;
  return currency==='KRW'?Math.round(amount):Math.round(amount/100)
}
function priceFromDetails(data,endDate){
  if(!data)return null;
  if(data.is_free)return {free:true};
  const p=data.price_overview;
  if(!p)return null;
  const original=wonFromSteamPrice(p.initial,p.currency);
  const current=wonFromSteamPrice(p.final,p.currency);
  if(p.discount_percent>0){
    return {onSale:true,original,current,endDate:endDate||''}
  }
  return {onSale:false,base:current||original}
}
async function fetchDiscountEndDate(appid){
  const payload=JSON.stringify({ids:[{appid:+appid}],context:{country_code:'KR',language:'koreana'},data_request:{include_all_purchase_options:true}});
  const api='https://api.steampowered.com/IStoreBrowseService/GetItems/v1/?input_json='+encodeURIComponent(payload);
  const tasks=[
    ()=>fetchJSON(api).then(j=>j?.response?.store_items?.[0]||null),
    ()=>fetchJSON('https://api.allorigins.win/raw?url='+encodeURIComponent(api)).then(j=>j?.response?.store_items?.[0]||null),
    ()=>fetchJSON('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(api)).then(j=>j?.response?.store_items?.[0]||null)
  ];
  try{
    const results=await collectAll(tasks);
    const item=results.find(Boolean);
    const ts=item?.best_purchase_option?.active_discounts?.[0]?.discount_end_date;
    if(!ts)return '';
    const d=new Date(ts*1000);
    const kst=new Date(d.toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
    return (kst.getMonth()+1)+'/'+kst.getDate()+'일까지'
  }catch(e){
    return ''
  }
}

/*
 장르 과다 등록 수정:
 이전 버전은 공식 genres + Steam 페이지 태그 + SteamSpy genre를 전부 합쳤습니다.
 Steam의 popular_tags는 장르가 아니므로 수십 개가 등록될 수 있었습니다.
 이제 장르는 우선순위를 두고 한 출처만 사용합니다.
 1) Steam AppDetails 공식 genres
 2) Steam 페이지의 /genre/ 링크
 3) 둘 다 없을 때만 SteamSpy
*/
async function fetchRealDetails(appid){
  const api='https://store.steampowered.com/api/appdetails?appids='+appid+'&cc=kr&l=korean';
  const page='https://store.steampowered.com/app/'+appid+'/?cc=kr&l=korean';

  const apiTasks=[
    ()=>fetchJSON(api).then(j=>j?.[appid]?.success?j[appid].data:null),
    ()=>fetchJSON('https://api.allorigins.win/raw?url='+encodeURIComponent(api)).then(j=>j?.[appid]?.success?j[appid].data:null),
    ()=>fetchJSON('https://api.allorigins.win/get?url='+encodeURIComponent(api)).then(j=>{
      const x=typeof j?.contents==='string'?JSON.parse(j.contents):j;
      return x?.[appid]?.success?x[appid].data:null
    }),
    ()=>fetchJSON('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(api)).then(j=>j?.[appid]?.success?j[appid].data:null),
    ()=>fetchJSON('https://corsproxy.io/?'+encodeURIComponent(api)).then(j=>j?.[appid]?.success?j[appid].data:null)
  ];
  const pageTasks=[
    ()=>fetchText('https://api.allorigins.win/raw?url='+encodeURIComponent(page)).then(parseSteamPage),
    ()=>fetchText('https://api.allorigins.win/get?url='+encodeURIComponent(page)).then(parseSteamPage),
    ()=>fetchText('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(page)).then(parseSteamPage),
    ()=>fetchText('https://corsproxy.io/?'+encodeURIComponent(page)).then(parseSteamPage)
  ];
  const spyTask=()=>fetchJSON('https://steamspy.com/api.php?request=appdetails&appid='+appid,7000)
    .then(d=>d?{name:d.name||'',genres:limitGenres(genresFromText(d.genre)).map(description=>({description}))}:null);

  let apiResults=[],pageResults=[],spyResults=[];
  for(let round=0;round<2;round++){
    const [apis,pages,spies]=await Promise.all([collectAll(apiTasks),collectAll(pageTasks),collectAll([spyTask])]);
    apiResults.push(...apis); pageResults.push(...pages); spyResults.push(...spies);

    const official=limitGenres(apiResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
    const pageGenres=limitGenres(pageResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
    const spyGenres=limitGenres(spyResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
    const genres=official.length?official:(pageGenres.length?pageGenres:spyGenres);
    const name=apiResults.map(x=>x&&x.name).find(Boolean)||pageResults.map(x=>x&&x.name).find(Boolean)||spyResults.map(x=>x&&x.name).find(Boolean)||'';
    const image=apiResults.map(x=>x&&x.header_image).find(Boolean)||pageResults.map(x=>x&&x.header_image).find(Boolean)||'';

    const metacritic=apiResults.map(x=>x&&x.metacritic&&x.metacritic.score).find(v=>v!=null);
    const is_free=apiResults.map(x=>x&&x.is_free).find(v=>v!=null);
    const price_overview=apiResults.map(x=>x&&x.price_overview).find(Boolean);
    if(image&&genres.length)return {name,header_image:image,genres:genres.map(description=>({description})),metacritic:metacritic!=null?metacritic:null,is_free:!!is_free,price_overview:price_overview||null};
    if(round===0)await new Promise(r=>setTimeout(r,700));
  }
  const official=limitGenres(apiResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
  const pageGenres=limitGenres(pageResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
  const spyGenres=limitGenres(spyResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
  const genres=official.length?official:(pageGenres.length?pageGenres:spyGenres);
  const name=apiResults.map(x=>x&&x.name).find(Boolean)||pageResults.map(x=>x&&x.name).find(Boolean)||spyResults.map(x=>x&&x.name).find(Boolean)||'';
  const image=apiResults.map(x=>x&&x.header_image).find(Boolean)||pageResults.map(x=>x&&x.header_image).find(Boolean)||steamHeaderImg(appid);
  const metacritic=apiResults.map(x=>x&&x.metacritic&&x.metacritic.score).find(v=>v!=null);
  const is_free=apiResults.map(x=>x&&x.is_free).find(v=>v!=null);
  const price_overview=apiResults.map(x=>x&&x.price_overview).find(Boolean);
  return {name,header_image:image,genres:genres.map(description=>({description})),metacritic:metacritic!=null?metacritic:null,is_free:!!is_free,price_overview:price_overview||null}
}

/*
 리뷰 요약(평가) 가져오기:
 Steam appreviews API의 query_summary에서 review_score, review_score_desc,
 total_positive/negative를 가져옵니다. num_per_page=0으로 실제 리뷰 목록은
 받지 않고 요약 정보만 최소한으로 받아옵니다. 실패해도 전체 흐름을 막지
 않도록 항상 null-safe 하게 동작합니다(뱃지를 그냥 표시하지 않음).
*/
async function fetchReviewSummary(appid){
  const api='https://store.steampowered.com/appreviews/'+appid+'?json=1&language=all&purchase_type=all&num_per_page=0';
  const tasks=[
    ()=>fetchJSON(api).then(j=>j&&j.success?j.query_summary:null),
    ()=>fetchJSON('https://api.allorigins.win/raw?url='+encodeURIComponent(api)).then(j=>j&&j.success?j.query_summary:null),
    ()=>fetchJSON('https://api.allorigins.win/get?url='+encodeURIComponent(api)).then(j=>{
      const x=typeof j?.contents==='string'?JSON.parse(j.contents):j;
      return x&&x.success?x.query_summary:null
    }),
    ()=>fetchJSON('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(api)).then(j=>j&&j.success?j.query_summary:null),
    ()=>fetchJSON('https://corsproxy.io/?'+encodeURIComponent(api)).then(j=>j&&j.success?j.query_summary:null)
  ];
  const results=await collectAll(tasks);
  const qs=results.find(Boolean);
  if(!qs)return null;
  return {
    score:qs.review_score||0,
    desc:qs.review_score_desc||'',
    positive:qs.total_positive||0,
    negative:qs.total_negative||0,
    total:qs.total_reviews||0
  }
}
function extractGenres(data){return limitGenres(Array.isArray(data&&data.genres)?data.genres:[]).join(', ')}
function formatKRW(n){return '₩'+Math.round(n).toLocaleString()}
function priceHtml(price){if(!price)return '';if(price.free)return '<div class="priceLine"><span class="priceFree">무료 플레이</span></div>';if(price.onSale&&price.original&&price.current){const pct=Math.round((1-price.current/price.original)*100);return '<div class="priceLine"><span class="discountBadge">-'+pct+'%</span><span class="priceOrig">'+formatKRW(price.original)+'</span><span class="priceFinal">'+formatKRW(price.current)+'</span>'+(price.endDate?'<span class="priceEnd">'+escapeHtml(price.endDate)+'</span>':'')+'</div>'}if(price.base)return '<div class="priceLine"><span class="priceFinal">'+formatKRW(price.base)+'</span></div>';return ''}

function renderGallery(){
 const grid=document.getElementById('gameGrid');
 let entries=Object.entries(GAMES).sort((a,b)=>{
  // 플레이 완료 게임은 항상 맨 아래, 같은 상태에서는 최신 등록순
  const aPlayed=!!a[1].played,bPlayed=!!b[1].played;
  if(aPlayed!==bPlayed)return aPlayed?1:-1;
  return (b[1].addedAt||0)-(a[1].addedAt||0);
 });
 if(SEARCH_QUERY){const q=SEARCH_QUERY.toLowerCase();entries=entries.filter(([,g])=>(g.title||'').toLowerCase().includes(q))}
 if(GENRE_FILTER)entries=entries.filter(([,g])=>(g.genres||'').split(',').map(x=>x.trim()).includes(GENRE_FILTER));
 if(BY_FILTER)entries=entries.filter(([,g])=>(g.by||'').trim()===BY_FILTER);

 grid.innerHTML='';
 if(!entries.length){grid.innerHTML='<div class="emptyMsg">해당하는 게임이 없어요.</div>';return}

 entries.forEach(([gid,g])=>{
  const card=document.createElement('a');
  card.className='gameCard'+(g.played?' played':'');
  card.href=g.url;
  card.target='_blank';
  card.rel='noopener noreferrer';

  // 관리자 모드에서는 카드 자체가 게임 관리 버튼 역할을 합니다.
  card.addEventListener('click',e=>{
    if(IS_ADMIN){
      e.preventDefault();
      openManageModal(gid);
    }
  });

  const fallbacks=[
    g.img,
    steamHeaderImg(g.appid),
    'https://cdn.akamai.steamstatic.com/steam/apps/'+g.appid+'/header.jpg',
    'https://cdn.cloudflare.steamstatic.com/steam/apps/'+g.appid+'/header.jpg',
    'https://cdn.akamai.steamstatic.com/steam/apps/'+g.appid+'/capsule_616x353.jpg'
  ].filter(Boolean);

  const tags=(g.genres||'').split(',').map(s=>s.trim()).filter(Boolean)
    .map(x=>'<span class="genreTag">'+escapeHtml(x)+'</span>').join('');

  // 리뷰/메타크리틱은 못 가져온 경우가 있으므로(g.review, g.metacritic이 없을 수 있음)
  // 값이 있을 때만 뱃지를 만들고, 없으면 그냥 아무것도 표시하지 않습니다.
  const reviewText=g.review?reviewBadgeText(g.review):'';
  const reviewBadge=reviewText?'<span class="ratingBadge rt-'+reviewTier(g.review.score)+'">'+escapeHtml(reviewText)+'</span>':'';
  const metaBadge=(g.metacritic!=null)?'<span class="metaBadge mc-'+metacriticTier(g.metacritic)+'">Metacritic '+escapeHtml(String(g.metacritic))+'</span>':'';
  const ratingLine=(reviewBadge||metaBadge)?'<div class="ratingLine">'+reviewBadge+metaBadge+'</div>':'';

  card.innerHTML=`${g.played?'<span class="playedBadge">완료</span>':''}
    <div class="recBadge">👤 ${escapeHtml(g.by)} 님 추천</div>
    <img class="thumb" src="${escapeHtml(fallbacks[0])}" alt=""
      data-fallbacks='${escapeHtml(JSON.stringify(fallbacks))}'
      data-fallback-idx="0" loading="lazy">
    <div class="info">
      <div class="gTitle">${escapeHtml(g.title)}</div>
      ${tags?'<div class="genreTags">'+tags+'</div>':''}
      ${ratingLine}
      ${priceHtml(g.price)}
    </div>`;

  const im=card.querySelector('img');
  im.addEventListener('error',function(){
    const list=JSON.parse(this.dataset.fallbacks),i=+this.dataset.fallbackIdx+1;
    if(i<list.length){this.dataset.fallbackIdx=i;this.src=list[i]}
    else this.style.display='none'
  });

  grid.appendChild(card);
 });
}

async function refreshGameMetadata(gid,button){
 const g=GAMES[gid];
 if(!g)return false;
 const old=button&&button.textContent;
 if(button){button.disabled=true;button.textContent='⏳ 불러오는 중...'}

 try{
   const [data,review]=await Promise.allSettled([fetchRealDetails(g.appid),fetchReviewSummary(g.appid)])
     .then(r=>[r[0].status==='fulfilled'?r[0].value:null,r[1].status==='fulfilled'?r[1].value:null]);
   const updates={img:(data&&data.header_image)||steamHeaderImg(g.appid)};
   const genres=extractGenres(data);
   if(genres)updates.genres=genres;
   if(data&&data.name)updates.title=data.name;
   // 메타크리틱/리뷰/가격은 못 가져와도(실패 시 null) 기존 값을 지우지 않고 그대로 둡니다.
   if(data&&data.metacritic!=null)updates.metacritic=data.metacritic;
   if(review)updates.review=review;
   let endDate='';
   if(data&&data.price_overview&&data.price_overview.discount_percent>0){
     endDate=await fetchDiscountEndDate(g.appid).catch(()=>'');
   }
   const price=priceFromDetails(data,endDate);
   if(price)updates.price=price;
   await db.ref('games/'+gid).update(updates);
   return !!genres || !!updates.img;
 }catch(e){
   return false;
 }finally{
   if(button){button.disabled=false;button.textContent=old}
 }
}

 }
 const dup=Object.values(GAMES).find(g=>g.appid===appid);
 if(dup){

 }

 const btn=document.getElementById('addBtn');
 btn.disabled=true;
 btn.textContent='Steam 정보 불러오는 중...';

 let data=null,review=null,endDate='';
 try{

   data=settled[0].status==='fulfilled'?settled[0].value:null;
   review=settled[1].status==='fulfilled'?settled[1].value:null;
   // 할인 종료일은 정가/할인가와 별도의(비공식) API라 실패해도 나머지 흐름을 막지 않게 따로 시도
   if(data&&data.price_overview&&data.price_overview.discount_percent>0){
     endDate=await fetchDiscountEndDate(appid).catch(()=>'');
   }
 }catch(e){}

 const img=(data&&data.header_image)||steamHeaderImg(appid);
 const genres=extractGenres(data);

 const metacritic=(data&&data.metacritic!=null)?data.metacritic:null;
 const price=priceFromDetails(data,endDate);

 const newRef=db.ref('games').push();
 const initialDoc={
   by,url,appid,title,img,genres,played:false,

 };
 // 메타크리틱/리뷰/가격은 못 가져왔을 때(null) 아예 필드를 안 넣어서 카드에서 조용히 생략되게 합니다.
 // 가격은 나중에라도 관리자가 "가격 수정"으로 채울 수 있습니다.

 document.getElementById('byInput').value='';

 // 첫 수집에서 장르·리뷰·메타크리틱·가격 중 뭐라도 비었으면 자동으로 한 번 더 재시도
 if(!genres||!review||metacritic==null||!price){

   setTimeout(async()=>{

         .then(r=>[r[0].status==='fulfilled'?r[0].value:null,r[1].status==='fulfilled'?r[1].value:null]);
       let retryEndDate='';

       err.textContent=retryGenres

       err.style.color=retryGenres?'var(--accent)':'var(--sub)';
       err.style.display='block';
     }catch(e){}
   },1200);
 }else{
   err.textContent='✓ 이미지 및 장르 정보를 정상적으로 가져왔습니다.';
   err.style.color='var(--accent)';
   err.style.display='block';
   setTimeout(()=>err.style.display='none',2200);
 }

function openManageModal(gid){
 CURRENT_MANAGE_ID=gid;
 CURRENT_EDIT_ID=null;
 const g=GAMES[gid];
 if(!g)return;
 showManageMain();
 const reviewInfoText=g.review?reviewBadgeText(g.review):'';
 const metaInfoText=(g.metacritic!=null)?('Metacritic '+g.metacritic):'';
 const ratingInfoLine=[reviewInfoText,metaInfoText].filter(Boolean).join(' · ')||'정보 없음';
 document.getElementById('managePreviewImg').src=g.img||steamHeaderImg(g.appid);document.getElementById('managePreviewTitle').textContent=g.title||'';document.getElementById('managePreviewInfo').innerHTML='APP ID: '+escapeHtml(g.appid||'-')+'<br>장르: '+escapeHtml(g.genres||'정보 없음')+'<br>평가: '+escapeHtml(ratingInfoLine)+'<br>상태: '+(g.played?'플레이 완료':'아직 안 함');
 document.getElementById('manageTitleInput').value=g.title||'';document.getElementById('manageByInput').value=g.by||'';document.getElementById('manageUrlInput').value=g.url||'';document.getElementById('manageGenresInput').value=g.genres||'';document.getElementById('managePlayedBtn').textContent=g.played?'↩ 플레이 미완료로 변경':'✓ 플레이 완료로 변경';document.getElementById('manageErr').style.display='none';document.getElementById('manageModalBg').classList.add('open');
}

document.getElementById('managePlayedBtn').addEventListener('click',async()=>{if(!CURRENT_MANAGE_ID)return;const g=GAMES[CURRENT_MANAGE_ID];await db.ref('games/'+CURRENT_MANAGE_ID+'/played').set(!g.played);setTimeout(()=>openManageModal(CURRENT_MANAGE_ID),50)});

document.getElementById('manageRefreshBtn').addEventListener('click',async()=>{if(!CURRENT_MANAGE_ID)return;const btn=document.getElementById('manageRefreshBtn');const ok=await refreshGameMetadata(CURRENT_MANAGE_ID,btn);const err=document.getElementById('manageErr');err.textContent=ok?'✓ 이미지·장르·게임 정보를 새로고침했습니다.':'⚠️ Steam 정보를 가져오지 못했습니다. 잠시 후 다시 시도해주세요.';err.style.color=ok?'var(--accent)':'var(--accent2)';err.style.display='block';setTimeout(()=>openManageModal(CURRENT_MANAGE_ID),80)});
document.getElementById('manageOpenBtn').addEventListener('click',()=>{const g=GAMES[CURRENT_MANAGE_ID];if(g&&g.url)window.open(g.url,'_blank','noopener')});
document.getElementById('manageSaveBtn').addEventListener('click',async()=>{if(!CURRENT_MANAGE_ID)return;const url=document.getElementById('manageUrlInput').value.trim(),appid=extractAppId(url)||GAMES[CURRENT_MANAGE_ID].appid;await db.ref('games/'+CURRENT_MANAGE_ID).update({title:document.getElementById('manageTitleInput').value.trim(),by:document.getElementById('manageByInput').value.trim(),url,appid,genres:document.getElementById('manageGenresInput').value.trim()});const err=document.getElementById('manageErr');err.textContent='✓ 기본 정보가 저장되었습니다.';err.style.color='var(--accent)';err.style.display='block'});
document.getElementById('manageDeleteBtn').addEventListener('click',async()=>{if(!CURRENT_MANAGE_ID)return;if(confirm('정말 이 게임을 삭제하시겠습니까?')){await db.ref('games/'+CURRENT_MANAGE_ID).remove();closeManageModal()}});

function openPinModal(){document.getElementById('pinInput').value='';document.getElementById('pinErr').style.display='none';document.getElementById('pinModalBg').classList.add('open');document.getElementById('pinInput').focus()}
function closePinModal(){document.getElementById('pinModalBg').classList.remove('open')}

/*
 공유하기(Web Share Target)로 들어왔을 때 처리:
 카톡 등에서 "공유하기"로 이 사이트를 선택하면 manifest.json의 share_target 설정에 따라
 ?title=...&text=...&url=... 형태의 쿼리스트링을 달고 이 페이지가 열립니다.
 그 안에서 스팀 링크를 정규식으로 찾아 PENDING_SHARE_URL에 저장해두고,
 관리자 PIN 입력을 유도한 뒤 통과하면 추가 폼에 자동으로 채워줍니다.
 스팀 링크를 못 찾으면 조용히 아무 것도 하지 않습니다(에러 노출 안 함).
*/
let PENDING_SHARE_URL=null;
function extractSteamLinkFromText(text){
  const m=(text||'').match(/https?:\/\/store\.steampowered\.com\/app\/\d+[^\s"'<>]*/i);
  return m?m[0]:null
}
function checkIncomingShare(){
  const params=new URLSearchParams(location.search);
  const combined=[params.get('url'),params.get('text'),params.get('title')].filter(Boolean).join(' ');
  const link=extractSteamLinkFromText(combined);
  if(link){
    PENDING_SHARE_URL=link;
    history.replaceState(null,'',location.pathname);
    if(IS_ADMIN)applyPendingShare();
    else openPinModal();
  }
}
function applyPendingShare(){
  if(!PENDING_SHARE_URL)return;
  document.getElementById('urlInput').value=PENDING_SHARE_URL;
  document.getElementById('byInput').focus();
  document.getElementById('adminCard').scrollIntoView({behavior:'smooth',block:'start'});
  PENDING_SHARE_URL=null;
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
function submitPin(){if(document.getElementById('pinInput').value===ADMIN_PIN){IS_ADMIN=true;document.getElementById('adminCard').classList.add('show');document.getElementById('lockIcon').textContent='🔓';document.getElementById('lockBtn').classList.add('unlocked');closePinModal();applyPendingShare()}else{const e=document.getElementById('pinErr');e.textContent='PIN이 틀렸어요.';e.style.display='block'}}
document.getElementById('lockBtn').addEventListener('click',()=>{if(IS_ADMIN){IS_ADMIN=false;document.getElementById('adminCard').classList.remove('show');document.getElementById('lockIcon').textContent='🔒';document.getElementById('lockBtn').classList.remove('unlocked')}else openPinModal()});document.getElementById('pinSubmitBtn').addEventListener('click',submitPin);document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitPin()});document.getElementById('pinCancelBtn').addEventListener('click',closePinModal);
document.querySelectorAll('.modalBg').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg){bg.classList.remove('open');if(bg.id==='manageModalBg'){CURRENT_MANAGE_ID=null;CURRENT_EDIT_ID=null;showManageMain()}}}));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{
 const bg=document.getElementById(b.dataset.close);
 bg.classList.remove('open');
 if(bg.id==='manageModalBg'){CURRENT_MANAGE_ID=null;CURRENT_EDIT_ID=null;showManageMain()}
}));
document.getElementById('searchInput').addEventListener('input',e=>{SEARCH_QUERY=e.target.value.trim();renderGallery()});document.getElementById('genreFilter').addEventListener('change',e=>{GENRE_FILTER=e.target.value;renderGallery()});document.getElementById('byFilter').addEventListener('change',e=>{BY_FILTER=e.target.value;renderGallery()});
const topBtn=document.getElementById('scrollTopBtn');window.addEventListener('scroll',()=>topBtn.classList.toggle('show',window.scrollY>400));topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
checkIncomingShare();
</script>
