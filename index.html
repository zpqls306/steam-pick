<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEAM 게임 추천 리스트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Pretendard:wght@400;500;600;700;800&display=swap');
  @font-face{
    font-family:'Pretendard Fallback';
    src:local('Malgun Gothic'),local('Apple SD Gothic Neo');
  }
  :root{
    --bg:#0a0e14; --panel:#12171f; --panel2:#161c26; --border:#20293a; --text:#e9eef5;
    --sub:#7d8ba0; --accent:#66c0f4; --accent2:#ff2d6f; --gold:#ffd60a;
    --font-display:'Rajdhani','Pretendard','Pretendard Fallback',sans-serif;
    --font-body:'Pretendard','Pretendard Fallback',system-ui,-apple-system,sans-serif;
    --bg-image: none;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:32px 16px 100px;
    background-image: var(--bg-image), radial-gradient(ellipse 900px 500px at 50% -10%, rgba(102,192,244,.08), transparent 60%);
    background-color:var(--bg);
    background-size: cover, auto;
    background-position: center, center;
    background-attachment: fixed, scroll;
    background-repeat: no-repeat, no-repeat;
    color:var(--text);font-family:var(--font-body);
    min-height:100vh;
  }
  .wrap{max-width:900px;margin:0 auto;}

  .appHeader{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  h1{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0;display:flex;align-items:center;gap:9px;}
  .lockBtn{background:var(--panel2);border:1px solid var(--border);color:var(--sub);border-radius:8px;
    padding:8px 14px;font-size:17px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .lockBtn .lockText{font-family:var(--font-display);font-size:9.5px;letter-spacing:.5px;}
  .lockBtn:hover{color:var(--accent);border-color:var(--accent);}
  .lockBtn.unlocked{color:var(--gold);border-color:var(--gold);}

  .adminCard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:22px;
    display:none;position:relative;overflow:hidden;}
  .adminCard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--accent2));}
  .adminCard.show{display:block;}
  .adminCard h3{font-family:var(--font-display);font-size:15px;margin:0 0 14px;color:var(--gold);}
  .adminCard h4{font-family:var(--font-display);font-size:12.5px;margin:18px 0 10px;color:var(--sub);
    text-transform:uppercase;letter-spacing:.5px;border-top:1px solid #1a212e;padding-top:14px;}
  label{font-family:var(--font-display);font-size:11.5px;font-weight:600;letter-spacing:.5px;color:var(--sub);
    display:block;margin-bottom:6px;text-transform:uppercase;}
  input[type=text],input[type=password],input[type=number],input[type=url]{
    width:100%;background:#04060a;color:var(--accent);border:1px solid var(--border);
    border-radius:6px;font-size:13.5px;padding:10px 12px;font-family:'Rajdhani',monospace;}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(102,192,244,.12);}
  .formRow{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .formRow > div{flex:1;min-width:150px;}
  button{cursor:pointer;border:none;border-radius:6px;font-weight:700;font-size:13px;padding:10px 18px;font-family:var(--font-body);}
  .btnPrimary{background:var(--accent);color:#04121c;font-weight:800;}
  .btnGhost{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btnGhost:hover{border-color:var(--accent);color:var(--accent);}
  .err{color:var(--accent2);font-size:12px;margin-top:8px;display:none;}
  .checkRow{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;}
  .checkRow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}

  .adminListItem{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #1a212e;font-size:12.5px;flex-wrap:wrap;}
  .adminListItem:last-child{border-bottom:none;}
  .adminListItem .aTitle{flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .adminListItem.played .aTitle{color:var(--sub);text-decoration:line-through;}
  .adminListItem button{background:none;color:var(--sub);font-size:13px;padding:2px 6px;}
  .adminListItem button:hover{color:var(--accent);}
  .adminListItem .delBtn:hover{color:var(--accent2);}
  .adminListItem .moveBtn:hover{color:var(--gold);}

  .adminColumns{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .adminColumns .colHead{font-family:var(--font-display);font-size:11px;letter-spacing:.5px;color:var(--sub);
    text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .adminColumns .colHead .cnt{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:1px 7px;font-size:10.5px;}
  @media (max-width: 560px){ .adminColumns{grid-template-columns:1fr;} }

  .pinModalBg,.priceModalBg{display:none;position:fixed;inset:0;background:rgba(4,6,10,.8);z-index:9999;
    align-items:center;justify-content:center;padding:20px;}
  .pinModalBg.open,.priceModalBg.open{display:flex;}
  .pinModalBox,.priceModalBox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:340px;width:100%;}
  .pinModalBox h3,.priceModalBox h3{font-family:var(--font-display);font-size:15px;margin:0 0 12px;}

  .filterRow{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .filterRow input{flex:2;min-width:160px;}
  .filterRow select{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:10px 12px;font-size:13px;}

  .gameGrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:18px;}
  .gameCard{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;
    text-decoration:none;color:var(--text);transition:transform .18s ease;display:block;}
  .gameCard::after{content:'';position:absolute;inset:0;border-radius:10px;padding:2px;pointer-events:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2),var(--gold));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0; transition:opacity .2s ease;}
  .gameCard:hover{transform:translateY(-4px);}
  .gameCard:hover::after{opacity:1;}
  .gameCard.played{opacity:.5;}
  .gameCard .playedBadge{position:absolute;top:8px;right:8px;background:var(--accent2);color:#fff;
    font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;font-family:var(--font-display);
    letter-spacing:.5px;z-index:2;}
  .gameCard .thumb{width:100%;aspect-ratio:460/215;object-fit:cover;background:#0d1119;display:block;}
  .gameCard .info{padding:12px 14px;}
  .gameCard .gTitle{font-weight:700;font-size:13.5px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;}
  .gameCard .gBy{font-size:11.5px;color:var(--sub);}
  .gameCard .gBy b{color:var(--accent);}
  .gameCard .genreTags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;}
  .gameCard .genreTag{font-size:9.5px;background:var(--panel2);border:1px solid var(--border);color:var(--sub);
    padding:2px 6px;border-radius:4px;font-family:var(--font-display);}
  .gameCard .priceLine{margin-top:8px;padding-top:8px;border-top:1px solid #1a212e;font-family:var(--font-display);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .gameCard .priceOrig{font-size:11.5px;color:var(--sub);text-decoration:line-through;}
  .gameCard .priceFinal{font-size:14px;font-weight:700;color:var(--gold);}
  .gameCard .discountBadge{background:var(--accent2);color:#fff;font-size:10.5px;font-weight:800;
    padding:2px 6px;border-radius:4px;}

  .emptyMsg{text-align:center;color:var(--sub);font-size:13.5px;padding:50px 0;grid-column:1/-1;}
  .verTag{font-size:10px;color:#3a4456;margin-bottom:18px;font-family:var(--font-display);}

  #scrollTopBtn{position:fixed;right:18px;bottom:24px;width:46px;height:46px;border-radius:50%;
    background:var(--accent);color:#04121c;font-size:18px;font-weight:800;display:none;align-items:center;
    justify-content:center;box-shadow:0 4px 16px rgba(102,192,244,.35);z-index:500;padding:0;line-height:1;}
  #scrollTopBtn.show{display:flex;}
</style>
</head>
<body>
<div class="wrap">
  <div class="appHeader">
    <h1>🎮 STEAM 게임 추천 리스트</h1>
    <button class="lockBtn" id="lockBtn" title="관리자 모드">
      <span id="lockIcon">🔒</span>
      <span class="lockText">관리자 모드</span>
    </button>
  </div>
  <div class="verTag">버전: 2026-08-25 v8 (검색/장르/배경/가격수동입력/플레이완료 분류 추가)</div>

  <div class="adminCard" id="adminCard">
    <h3>⚙️ 관리자 모드 — 게임 추가</h3>
    <div class="formRow">
      <div><input id="byInput" type="text" placeholder="추천한 사람 이름"></div>
      <div><input id="urlInput" type="text" placeholder="스팀 게임 URL (store.steampowered.com/app/...)"></div>
    </div>

    <label>가격 (₩) — 할인 없을 때</label>
    <div class="formRow">
      <div><input id="priceBaseInput" type="number" placeholder="예: 29000"></div>
    </div>

    <div class="checkRow">
      <input type="checkbox" id="onSaleCheck">
      <label style="margin:0;" for="onSaleCheck">할인 중이에요</label>
    </div>
    <div class="formRow" id="saleFields" style="display:none;">
      <div><input id="priceOrigInput" type="number" placeholder="원가 (예: 29000)"></div>
      <div><input id="priceNowInput" type="number" placeholder="할인가 (예: 14500)"></div>
    </div>

    <button class="btnPrimary" id="addBtn">추가</button>
    <div class="err" id="addErr"></div>

    <h4>🖼 배경화면 (GIF/이미지 URL)</h4>
    <div class="formRow">
      <div><input id="bgUrlInput" type="url" placeholder="배경으로 쓸 이미지/GIF 주소 (호스팅한 URL 붙여넣기)"></div>
      <button class="btnGhost" id="bgSaveBtn">적용</button>
    </div>
    <div style="font-size:11px;color:var(--sub);margin-top:-4px;margin-bottom:4px;">
      * GIF 파일 자체를 여기 업로드하는 기능은 없어요. GitHub 저장소나 이미지 호스팅에 파일을 올린 뒤, 그 주소(URL)를 붙여넣어주세요.
    </div>

    <h4>📋 등록된 게임 관리</h4>
    <div class="adminColumns">
      <div>
        <div class="colHead">🎮 아직 안 한 게임 <span class="cnt" id="notPlayedCount">0</span></div>
        <div id="adminListNotPlayed"></div>
      </div>
      <div>
        <div class="colHead">✅ 플레이 완료 <span class="cnt" id="playedCount">0</span></div>
        <div id="adminListPlayed"></div>
      </div>
    </div>
  </div>

  <div class="filterRow">
    <input id="searchInput" type="text" placeholder="🔍 게임 이름 검색...">
    <select id="genreFilter">
      <option value="">전체 장르</option>
    </select>
  </div>

  <div class="gameGrid" id="gameGrid">
    <div class="emptyMsg">불러오는 중...</div>
  </div>
</div>

<button id="scrollTopBtn" title="맨 위로">↑</button>

<div class="pinModalBg" id="pinModalBg">
  <div class="pinModalBox">
    <h3>🔒 관리자 PIN 입력</h3>
    <input id="pinInput" type="password" placeholder="PIN 번호">
    <div class="err" id="pinErr"></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btnPrimary" id="pinSubmitBtn" style="flex:1;">확인</button>
      <button class="btnGhost" id="pinCancelBtn">취소</button>
    </div>
  </div>
</div>

<div class="priceModalBg" id="priceModalBg">
  <div class="priceModalBox">
    <h3>💰 가격 수정</h3>
    <label>가격 (₩) — 할인 없을 때</label>
    <div class="formRow"><div><input id="editPriceBaseInput" type="number"></div></div>
    <div class="checkRow">
      <input type="checkbox" id="editOnSaleCheck">
      <label style="margin:0;" for="editOnSaleCheck">할인 중이에요</label>
    </div>
    <div class="formRow" id="editSaleFields" style="display:none;">
      <div><input id="editPriceOrigInput" type="number" placeholder="원가"></div>
      <div><input id="editPriceNowInput" type="number" placeholder="할인가"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btnPrimary" id="priceSaveBtn" style="flex:1;">저장</button>
      <button class="btnGhost" id="priceCancelBtn">취소</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// =====================================================================
// 관리자 PIN — 원하는 값으로 바꾸세요. (완전한 보안은 아니라는 점 참고!)
const ADMIN_PIN = '388rhdqn';
// =====================================================================

const firebaseConfig = {
  apiKey: "AIzaSyClUo4m0Rlsd48K6R4UgsZdEpq3ojJVbBA",
  authDomain: "steam-picks.firebaseapp.com",
  databaseURL: "https://steam-picks-default-rtdb.firebaseio.com",
  projectId: "steam-picks",
  storageBucket: "steam-picks.firebasestorage.app",
  messagingSenderId: "939715595783",
  appId: "1:939715595783:web:1bbdf1aca6bfe5dc7d64a2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let IS_ADMIN = false;
let GAMES = {};
let CURRENT_EDIT_ID = null;

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function extractAppId(url){
  const m = url.match(/store\.steampowered\.com\/app\/(\d+)/);
  return m ? m[1] : null;
}

function extractTitleFromUrl(url, appid){
  const m = url.match(/store\.steampowered\.com\/app\/\d+\/([^/?]+)/);
  if(m) return decodeURIComponent(m[1]).replace(/_/g, ' ');
  return appid ? ('앱 ' + appid) : url;
}

function steamHeaderImg(appid){
  return 'https://cdn.akamai.steamstatic.com/steam/apps/' + appid + '/header.jpg';
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

// 관리자가 게임을 추가/새로고침할 때만 호출. 여러 프록시를 동시에(경합) 시도해서
// 가장 먼저 성공하는 걸 바로 씀 — 순차 방식보다 훨씬 빠름.
async function fetchRealDetails(appid){
  const targetUrl = 'https://store.steampowered.com/api/appdetails?appids=' + appid + '&cc=kr&l=korean';
  const attempts = [
    () => fetch(targetUrl),
    () => fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl)),
    () => fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(targetUrl)),
    () => fetch('https://cors.x2u.in/' + targetUrl),
    () => fetch('https://corsfix.com/' + targetUrl),
    () => fetch('https://thingproxy.freeboard.io/fetch/' + targetUrl),
  ];

  const tasks = attempts.map(fn => (async () => {
    const res = await withTimeout(fn(), 6000);
    if(!res.ok) throw new Error('bad status');
    let json = await res.json();
    if(json && typeof json.contents === 'string') json = JSON.parse(json.contents);
    const entry = json && json[appid];
    if(!(entry && entry.success && entry.data)) throw new Error('no data');
    return entry.data;
  })());

  try{
    return await Promise.any(tasks);
  }catch(e){
    return null;
  }
}

function extractGenres(data){
  if(data && Array.isArray(data.genres)){
    return data.genres.map(g => g.description).filter(Boolean).join(', ');
  }
  return '';
}

// ---------- 배경화면 ----------
function applyBgFromConfig(cfg){
  const url = cfg && cfg.bgUrl;
  document.documentElement.style.setProperty('--bg-image', url ? `url("${url}")` : 'none');
}

db.ref('config').on('value', (snapshot) => {
  applyBgFromConfig(snapshot.val() || {});
});

document.getElementById('bgSaveBtn').addEventListener('click', () => {
  const url = document.getElementById('bgUrlInput').value.trim();
  db.ref('config/bgUrl').set(url);
});

// ---------- 가격 표시용 헬퍼 ----------
function formatKRW(n){
  return '₩' + Math.round(n).toLocaleString();
}

function priceHtml(price){
  if(!price) return '';
  if(price.onSale && price.original && price.current){
    const pct = Math.round((1 - price.current / price.original) * 100);
    return '<div class="priceLine">' +
      '<span class="discountBadge">-' + pct + '%</span>' +
      '<span class="priceOrig">' + formatKRW(price.original) + '</span>' +
      '<span class="priceFinal">' + formatKRW(price.current) + '</span>' +
      '</div>';
  }
  if(price.base){
    return '<div class="priceLine"><span class="priceFinal">' + formatKRW(price.base) + '</span></div>';
  }
  return '';
}

// ---------- 검색/필터 상태 ----------
let SEARCH_QUERY = '';
let GENRE_FILTER = '';

function updateGenreOptions(){
  const select = document.getElementById('genreFilter');
  const current = select.value;
  const genreSet = new Set();
  Object.values(GAMES).forEach(g => {
    (g.genres || '').split(',').map(s => s.trim()).filter(Boolean).forEach(gr => genreSet.add(gr));
  });
  select.innerHTML = '<option value="">전체 장르</option>' +
    Array.from(genreSet).sort().map(gr => '<option value="' + escapeHtml(gr) + '">' + escapeHtml(gr) + '</option>').join('');
  select.value = current;
}

// ---------- 갤러리 렌더링 (모두에게 보임) ----------
function renderGallery(){
  const grid = document.getElementById('gameGrid');
  let entries = Object.entries(GAMES)
    .sort((a, b) => (b[1].addedAt || 0) - (a[1].addedAt || 0));

  if(SEARCH_QUERY){
    const q = SEARCH_QUERY.toLowerCase();
    entries = entries.filter(([, g]) => (g.title || '').toLowerCase().includes(q));
  }
  if(GENRE_FILTER){
    entries = entries.filter(([, g]) => (g.genres || '').includes(GENRE_FILTER));
  }

  grid.innerHTML = '';

  if(entries.length === 0){
    grid.innerHTML = '<div class="emptyMsg">해당하는 게임이 없어요.</div>';
    return;
  }

  entries.forEach(([gid, g]) => {
    const card = document.createElement('a');
    card.className = 'gameCard' + (g.played ? ' played' : '');
    card.href = g.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';

    const fallbacks = [
      g.img,
      'https://cdn.akamai.steamstatic.com/steam/apps/' + g.appid + '/header.jpg',
      'https://cdn.cloudflare.steamstatic.com/steam/apps/' + g.appid + '/header.jpg',
      'https://cdn.akamai.steamstatic.com/steam/apps/' + g.appid + '/capsule_616x353.jpg',
      'https://cdn.akamai.steamstatic.com/steam/apps/' + g.appid + '/library_600x900.jpg'
    ].filter(Boolean);

    const genreTags = (g.genres || '').split(',').map(s => s.trim()).filter(Boolean)
      .map(gr => '<span class="genreTag">' + escapeHtml(gr) + '</span>').join('');

    card.innerHTML = `
      ${g.played ? '<span class="playedBadge">완료</span>' : ''}
      <img class="thumb" src="${escapeHtml(fallbacks[0])}" alt=""
        data-fallbacks='${JSON.stringify(fallbacks)}' data-fallback-idx="0" loading="lazy">
      <div class="info">
        <div class="gTitle">${escapeHtml(g.title)}</div>
        <div class="gBy"><b>${escapeHtml(g.by)}</b> 님 추천</div>
        ${genreTags ? '<div class="genreTags">' + genreTags + '</div>' : ''}
        ${priceHtml(g.price)}
      </div>
    `;
    const img = card.querySelector('img');
    img.addEventListener('error', function(){
      const list = JSON.parse(this.dataset.fallbacks);
      const idx = parseInt(this.dataset.fallbackIdx, 10) + 1;
      if(idx < list.length){
        this.dataset.fallbackIdx = idx;
        this.src = list[idx];
      } else {
        this.style.display = 'none';
      }
    });
    grid.appendChild(card);
  });
}

// ---------- 관리자 목록 렌더링 (관리자만 보임) ----------
function renderAdminList(){
  const notPlayedBox = document.getElementById('adminListNotPlayed');
  const playedBox = document.getElementById('adminListPlayed');
  notPlayedBox.innerHTML = '';
  playedBox.innerHTML = '';

  const entries = Object.entries(GAMES).sort((a, b) => (b[1].addedAt || 0) - (a[1].addedAt || 0));
  const notPlayed = entries.filter(([, g]) => !g.played);
  const played = entries.filter(([, g]) => g.played);

  document.getElementById('notPlayedCount').textContent = notPlayed.length;
  document.getElementById('playedCount').textContent = played.length;

  function buildItem(gid, g, isPlayed){
    const el = document.createElement('div');
    el.className = 'adminListItem' + (isPlayed ? ' played' : '');
    el.innerHTML = `
      <span class="aTitle">${escapeHtml(g.title)}</span>
      <button class="moveBtn" data-id="${escapeHtml(gid)}" title="${isPlayed ? '안 한 게임으로 되돌리기' : '플레이 완료로 이동'}">${isPlayed ? '◀' : '▶'}</button>
      <button class="priceBtn" data-id="${escapeHtml(gid)}" title="가격 수정">💰</button>
      <button class="refreshImgBtn" data-id="${escapeHtml(gid)}" data-appid="${escapeHtml(g.appid)}" title="이미지/장르 새로고침">🔄</button>
      <button class="delBtn" data-id="${escapeHtml(gid)}" title="삭제">✕</button>
    `;
    return el;
  }

  if(notPlayed.length === 0){
    notPlayedBox.innerHTML = '<div style="font-size:12px;color:var(--sub);">없음</div>';
  } else {
    notPlayed.forEach(([gid, g]) => notPlayedBox.appendChild(buildItem(gid, g, false)));
  }
  if(played.length === 0){
    playedBox.innerHTML = '<div style="font-size:12px;color:var(--sub);">없음</div>';
  } else {
    played.forEach(([gid, g]) => playedBox.appendChild(buildItem(gid, g, true)));
  }

  document.querySelectorAll('.moveBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const gid = btn.getAttribute('data-id');
      const current = GAMES[gid];
      db.ref('games/' + gid + '/played').set(!(current && current.played));
    });
  });

  document.querySelectorAll('.priceBtn').forEach(btn => {
    btn.addEventListener('click', () => openPriceModal(btn.getAttribute('data-id')));
  });

  document.querySelectorAll('.refreshImgBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const gid = btn.getAttribute('data-id');
      const appid = btn.getAttribute('data-appid');
      btn.disabled = true;
      btn.textContent = '⏳';
      const data = await fetchRealDetails(appid);
      if(data){
        const updates = {};
        if(data.header_image) updates.img = data.header_image;
        const genres = extractGenres(data);
        if(genres) updates.genres = genres;
        if(Object.keys(updates).length) db.ref('games/' + gid).update(updates);
      }
      btn.disabled = false;
      btn.textContent = '🔄';
    });
  });

  document.querySelectorAll('.delBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      db.ref('games/' + btn.getAttribute('data-id')).remove();
    });
  });
}

// ---------- Firebase 실시간 구독 ----------
db.ref('games').on('value', (snapshot) => {
  GAMES = snapshot.val() || {};
  updateGenreOptions();
  renderGallery();
  if(IS_ADMIN) renderAdminList();
});

// ---------- 게임 추가 ----------
document.getElementById('onSaleCheck').addEventListener('change', (e) => {
  document.getElementById('saleFields').style.display = e.target.checked ? 'flex' : 'none';
});

async function addGame(){
  const by = document.getElementById('byInput').value.trim();
  const url = document.getElementById('urlInput').value.trim();
  const errEl = document.getElementById('addErr');
  errEl.style.display = 'none';

  if(!by){ errEl.textContent = '추천한 사람 이름을 입력해주세요.'; errEl.style.display = 'block'; return; }
  const appid = extractAppId(url);
  if(!appid){ errEl.textContent = 'store.steampowered.com/app/숫자/... 형태의 스팀 URL을 넣어주세요.'; errEl.style.display = 'block'; return; }

  const title = extractTitleFromUrl(url, appid);
  const onSale = document.getElementById('onSaleCheck').checked;
  const price = onSale
    ? { onSale: true, original: Number(document.getElementById('priceOrigInput').value) || 0, current: Number(document.getElementById('priceNowInput').value) || 0 }
    : { onSale: false, base: Number(document.getElementById('priceBaseInput').value) || 0 };

  const addBtn = document.getElementById('addBtn');
  addBtn.disabled = true;
  addBtn.textContent = '이미지/장르 확인 중...';

  const data = await fetchRealDetails(appid);
  const img = (data && data.header_image) || steamHeaderImg(appid);
  const genres = data ? extractGenres(data) : '';

  const newRef = db.ref('games').push();
  newRef.set({
    by, url, appid, title, img, genres, price, played: false,
    addedAt: firebase.database.ServerValue.TIMESTAMP
  });

  document.getElementById('byInput').value = '';
  document.getElementById('urlInput').value = '';
  document.getElementById('priceBaseInput').value = '';
  document.getElementById('priceOrigInput').value = '';
  document.getElementById('priceNowInput').value = '';
  document.getElementById('onSaleCheck').checked = false;
  document.getElementById('saleFields').style.display = 'none';
  addBtn.disabled = false;
  addBtn.textContent = '추가';

  if(!data){
    errEl.textContent = '⚠️ 이미지/장르 정보를 못 가져와서 예전 방식 주소로 저장했어요. 관리 목록에서 🔄로 다시 시도해보세요.';
    errEl.style.display = 'block';
    errEl.style.color = 'var(--sub)';
  }
}

// ---------- 가격 수정 모달 ----------
function openPriceModal(gid){
  CURRENT_EDIT_ID = gid;
  const g = GAMES[gid];
  const price = (g && g.price) || {};
  document.getElementById('editPriceBaseInput').value = price.base || '';
  document.getElementById('editOnSaleCheck').checked = !!price.onSale;
  document.getElementById('editSaleFields').style.display = price.onSale ? 'flex' : 'none';
  document.getElementById('editPriceOrigInput').value = price.original || '';
  document.getElementById('editPriceNowInput').value = price.current || '';
  document.getElementById('priceModalBg').classList.add('open');
}

function closePriceModal(){
  document.getElementById('priceModalBg').classList.remove('open');
  CURRENT_EDIT_ID = null;
}

document.getElementById('editOnSaleCheck').addEventListener('change', (e) => {
  document.getElementById('editSaleFields').style.display = e.target.checked ? 'flex' : 'none';
});

document.getElementById('priceSaveBtn').addEventListener('click', () => {
  if(!CURRENT_EDIT_ID) return;
  const onSale = document.getElementById('editOnSaleCheck').checked;
  const price = onSale
    ? { onSale: true, original: Number(document.getElementById('editPriceOrigInput').value) || 0, current: Number(document.getElementById('editPriceNowInput').value) || 0 }
    : { onSale: false, base: Number(document.getElementById('editPriceBaseInput').value) || 0 };
  db.ref('games/' + CURRENT_EDIT_ID + '/price').set(price);
  closePriceModal();
});
document.getElementById('priceCancelBtn').addEventListener('click', closePriceModal);
document.getElementById('priceModalBg').addEventListener('click', (e) => { if(e.target.id === 'priceModalBg') closePriceModal(); });

// ---------- 관리자 PIN 처리 ----------
function openPinModal(){
  document.getElementById('pinInput').value = '';
  document.getElementById('pinErr').style.display = 'none';
  document.getElementById('pinModalBg').classList.add('open');
  document.getElementById('pinInput').focus();
}

function closePinModal(){
  document.getElementById('pinModalBg').classList.remove('open');
}

function submitPin(){
  const val = document.getElementById('pinInput').value;
  if(val === ADMIN_PIN){
    IS_ADMIN = true;
    document.getElementById('adminCard').classList.add('show');
    document.getElementById('lockIcon').textContent = '🔓';
    document.getElementById('lockBtn').classList.add('unlocked');
    renderAdminList();
    closePinModal();
  } else {
    const err = document.getElementById('pinErr');
    err.textContent = 'PIN이 틀렸어요.';
    err.style.display = 'block';
  }
}

document.getElementById('lockBtn').addEventListener('click', () => {
  if(IS_ADMIN){
    IS_ADMIN = false;
    document.getElementById('adminCard').classList.remove('show');
    document.getElementById('lockIcon').textContent = '🔒';
    document.getElementById('lockBtn').classList.remove('unlocked');
  } else {
    openPinModal();
  }
});
document.getElementById('pinSubmitBtn').addEventListener('click', submitPin);
document.getElementById('pinInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') submitPin(); });
document.getElementById('pinCancelBtn').addEventListener('click', closePinModal);
document.getElementById('pinModalBg').addEventListener('click', (e) => { if(e.target.id === 'pinModalBg') closePinModal(); });

document.getElementById('addBtn').addEventListener('click', addGame);
document.getElementById('urlInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') addGame(); });

// ---------- 검색/장르 필터 ----------
document.getElementById('searchInput').addEventListener('input', (e) => {
  SEARCH_QUERY = e.target.value.trim();
  renderGallery();
});
document.getElementById('genreFilter').addEventListener('change', (e) => {
  GENRE_FILTER = e.target.value;
  renderGallery();
});

// ---------- 맨 위로 가기 ----------
const scrollTopBtn = document.getElementById('scrollTopBtn');
window.addEventListener('scroll', () => {
  scrollTopBtn.classList.toggle('show', window.scrollY > 400);
});
scrollTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
