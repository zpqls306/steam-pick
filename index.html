<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 추천 갤러리</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Pretendard:wght@400;500;600;700;800&display=swap');
  @font-face{
    font-family:'Pretendard Fallback';
    src:local('Malgun Gothic'),local('Apple SD Gothic Neo');
  }
  :root{
    --bg:#0a0e14; --panel:#12171f; --panel2:#161c26; --border:#20293a; --text:#e9eef5;
    --sub:#7d8ba0; --accent:#66c0f4; --accent2:#ff2d6f; --gold:#ffd60a;
    --font-display:'Rajdhani','Pretendard','Pretendard Fallback',sans-serif;
    --font-body:'Pretendard','Pretendard Fallback',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:32px 16px 100px;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(102,192,244,.08), transparent 60%), var(--bg);
    color:var(--text);font-family:var(--font-body);
  }
  .wrap{max-width:860px;margin:0 auto;}

  .appHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px;}
  h1{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0;display:flex;align-items:center;gap:9px;}
  .sub{color:var(--sub);font-size:13.5px;margin-bottom:22px;}
  .lockBtn{background:var(--panel2);border:1px solid var(--border);color:var(--sub);border-radius:8px;
    padding:9px 13px;font-size:15px;cursor:pointer;}
  .lockBtn:hover{color:var(--accent);border-color:var(--accent);}
  .lockBtn.unlocked{color:var(--gold);border-color:var(--gold);}

  .adminCard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:22px;
    display:none;position:relative;overflow:hidden;}
  .adminCard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--accent2));}
  .adminCard.show{display:block;}
  .adminCard h3{font-family:var(--font-display);font-size:15px;margin:0 0 14px;color:var(--gold);}
  label{font-family:var(--font-display);font-size:11.5px;font-weight:600;letter-spacing:.5px;color:var(--sub);
    display:block;margin-bottom:6px;text-transform:uppercase;}
  input[type=text],input[type=password]{width:100%;background:#04060a;color:var(--accent);border:1px solid var(--border);
    border-radius:6px;font-size:13.5px;padding:10px 12px;font-family:'Rajdhani',monospace;}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(102,192,244,.12);}
  .formRow{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .formRow > div{flex:1;min-width:160px;}
  button{cursor:pointer;border:none;border-radius:6px;font-weight:700;font-size:13px;padding:10px 18px;font-family:var(--font-body);}
  .btnPrimary{background:var(--accent);color:#04121c;font-weight:800;}
  .btnGhost{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btnGhost:hover{border-color:var(--accent);color:var(--accent);}
  .err{color:var(--accent2);font-size:12px;margin-top:8px;display:none;}
  .adminListItem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1a212e;font-size:12.5px;}
  .adminListItem:last-child{border-bottom:none;}
  .adminListItem .aTitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .adminListItem .delBtn{background:none;color:var(--sub);font-size:14px;padding:2px 6px;}
  .adminListItem .refreshImgBtn{background:none;color:var(--sub);font-size:13px;padding:2px 6px;}
  .adminListItem .refreshImgBtn:hover{color:var(--accent);}
  .adminListItem .delBtn:hover{color:var(--accent2);}

  .pinModalBg{display:none;position:fixed;inset:0;background:rgba(4,6,10,.8);z-index:9999;
    align-items:center;justify-content:center;padding:20px;}
  .pinModalBg.open{display:flex;}
  .pinModalBox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:320px;width:100%;}
  .pinModalBox h3{font-family:var(--font-display);font-size:15px;margin:0 0 12px;}

  .gameGrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:16px;}
  .gameCard{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;
    text-decoration:none;color:var(--text);transition:transform .15s ease, border-color .15s ease;display:block;}
  .gameCard:hover{transform:translateY(-3px);border-color:var(--accent);}
  .gameCard .thumb{width:100%;aspect-ratio:460/215;object-fit:cover;background:#0d1119;display:block;}
  .gameCard .info{padding:12px 14px;}
  .gameCard .gTitle{font-weight:700;font-size:13.5px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;}
  .gameCard .gBy{font-size:11.5px;color:var(--sub);}
  .gameCard .gBy b{color:var(--accent);}

  .emptyMsg{text-align:center;color:var(--sub);font-size:13.5px;padding:50px 0;grid-column:1/-1;}
  .verTag{font-size:10px;color:#3a4456;margin-bottom:18px;font-family:var(--font-display);}
</style>
</head>
<body>
<div class="wrap">
  <div class="appHeader">
    <h1>🎮 게임 추천 갤러리</h1>
    <button class="lockBtn" id="lockBtn" title="관리자 모드">🔒</button>
  </div>
  <div class="sub">사람들이 추천해준 스팀 게임들을 모아봤어요.</div>
  <div class="verTag">버전: 2026-08-25 v7 (프록시 4개 추가 + 실패시 자동 재시도)</div>

  <div class="adminCard" id="adminCard">
    <h3>⚙️ 관리자 모드 — 게임 추가</h3>
    <div class="formRow">
      <div><input id="byInput" type="text" placeholder="추천한 사람 이름"></div>
      <div><input id="urlInput" type="text" placeholder="스팀 게임 URL (store.steampowered.com/app/...)"></div>
    </div>
    <button class="btnPrimary" id="addBtn">추가</button>
    <div class="err" id="addErr"></div>

    <div style="margin-top:18px;">
      <label>등록된 게임 (관리용 — 삭제 가능)</label>
      <div id="adminList"></div>
    </div>
  </div>

  <div class="gameGrid" id="gameGrid">
    <div class="emptyMsg">불러오는 중...</div>
  </div>
</div>

<div class="pinModalBg" id="pinModalBg">
  <div class="pinModalBox">
    <h3>🔒 관리자 PIN 입력</h3>
    <input id="pinInput" type="password" placeholder="PIN 번호">
    <div class="err" id="pinErr"></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btnPrimary" id="pinSubmitBtn" style="flex:1;">확인</button>
      <button class="btnGhost" id="pinCancelBtn">취소</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// =====================================================================
// 관리자 PIN — 원하는 값으로 바꾸세요. (완전한 보안은 아니라는 점 참고!)
const ADMIN_PIN = '1234';
// =====================================================================

const firebaseConfig = {
  apiKey: "AIzaSyClUo4m0Rlsd48K6R4UgsZdEpq3ojJVbBA",
  authDomain: "steam-picks.firebaseapp.com",
  databaseURL: "https://steam-picks-default-rtdb.firebaseio.com",
  projectId: "steam-picks",
  storageBucket: "steam-picks.firebasestorage.app",
  messagingSenderId: "939715595783",
  appId: "1:939715595783:web:1bbdf1aca6bfe5dc7d64a2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let IS_ADMIN = false;
let GAMES = {};

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function extractAppId(url){
  const m = url.match(/store\.steampowered\.com\/app\/(\d+)/);
  return m ? m[1] : null;
}

function extractTitleFromUrl(url, appid){
  const m = url.match(/store\.steampowered\.com\/app\/\d+\/([^/?]+)/);
  if(m) return decodeURIComponent(m[1]).replace(/_/g, ' ');
  return appid ? ('앱 ' + appid) : url;
}

function steamHeaderImg(appid){
  return 'https://cdn.akamai.steamstatic.com/steam/apps/' + appid + '/header.jpg';
}

// 관리자가 게임을 "추가"할 때 딱 한 번만 호출 — 실제 header_image(해시 포함) 주소를 얻어서 저장해둠.
// 방문자들은 이 저장된 주소를 그대로 쓰기만 하므로, API 호출/프록시 문제와 완전히 무관해짐.
async function fetchRealHeaderImage(appid){
  const attempts = [
    (url) => fetch(url),
    (url) => fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)),
    (url) => fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)),
    (url) => fetch('https://cors.x2u.in/' + url),
    (url) => fetch('https://corsfix.com/' + url),
    (url) => fetch('https://thingproxy.freeboard.io/fetch/' + url),
    (url) => fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url)),
  ];
  const targetUrl = 'https://store.steampowered.com/api/appdetails?appids=' + appid + '&cc=kr&l=korean&filters=basic';

  async function tryOnce(){
    for(const attempt of attempts){
      try{
        const res = await attempt(targetUrl);
        if(!res.ok) continue;
        let json = await res.json();
        // allorigins의 /get 방식은 실제 응답이 .contents 안에 문자열로 들어있음
        if(json && typeof json.contents === 'string'){
          json = JSON.parse(json.contents);
        }
        const entry = json && json[appid];
        if(entry && entry.success && entry.data && entry.data.header_image){
          return entry.data.header_image;
        }
      }catch(e){ /* 다음 방법 시도 */ }
    }
    return null;
  }

  // 한 바퀴 다 실패하면, 짧게 쉬었다가 한 번 더 전체를 재시도 (프록시 일시 과부하 대응)
  let result = await tryOnce();
  if(!result){
    await new Promise(resolve => setTimeout(resolve, 800));
    result = await tryOnce();
  }
  return result; // 그래도 실패하면 null — 호출부에서 레거시 주소로 대체
}

// ---------- 갤러리 렌더링 (모두에게 보임) ----------
function renderGallery(){
  const grid = document.getElementById('gameGrid');
  const entries = Object.entries(GAMES)
    .sort((a, b) => (b[1].addedAt || 0) - (a[1].addedAt || 0));
  grid.innerHTML = '';

  if(entries.length === 0){
    grid.innerHTML = '<div class="emptyMsg">아직 등록된 게임이 없어요.</div>';
    return;
  }

  entries.forEach(([gid, g]) => {
    const card = document.createElement('a');
    card.className = 'gameCard';
    card.href = g.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    // 저장해둔 실제 이미지 주소(g.img, 해시 포함)를 최우선으로, 실패하면 레거시 주소들을 순서대로 시도
    const fallbacks = [
      g.img,
      'https://cdn.akamai.steamstatic.com/steam/apps/' + g.appid + '/header.jpg',
      'https://cdn.cloudflare.steamstatic.com/steam/apps/' + g.appid + '/header.jpg',
      'https://cdn.akamai.steamstatic.com/steam/apps/' + g.appid + '/capsule_616x353.jpg',
      'https://cdn.akamai.steamstatic.com/steam/apps/' + g.appid + '/library_600x900.jpg'
    ].filter(Boolean);
    card.innerHTML = `
      <img class="thumb" src="${escapeHtml(fallbacks[0])}" alt=""
        data-fallbacks='${JSON.stringify(fallbacks)}' data-fallback-idx="0" loading="lazy">
      <div class="info">
        <div class="gTitle">${escapeHtml(g.title)}</div>
        <div class="gBy"><b>${escapeHtml(g.by)}</b> 님 추천</div>
      </div>
    `;
    const img = card.querySelector('img');
    img.addEventListener('error', function(){
      const list = JSON.parse(this.dataset.fallbacks);
      const idx = parseInt(this.dataset.fallbackIdx, 10) + 1;
      if(idx < list.length){
        this.dataset.fallbackIdx = idx;
        this.src = list[idx];
      } else {
        this.style.display = 'none';
      }
    });
    grid.appendChild(card);
  });
}

// ---------- 관리자 목록 렌더링 (관리자만 보임) ----------
function renderAdminList(){
  const list = document.getElementById('adminList');
  const entries = Object.entries(GAMES).sort((a, b) => (b[1].addedAt || 0) - (a[1].addedAt || 0));
  list.innerHTML = '';

  if(entries.length === 0){
    list.innerHTML = '<div style="font-size:12px;color:var(--sub);">등록된 게임이 없어요.</div>';
    return;
  }

  entries.forEach(([gid, g]) => {
    const el = document.createElement('div');
    el.className = 'adminListItem';
    el.innerHTML = `
      <span class="aTitle">${escapeHtml(g.title)} — ${escapeHtml(g.by)}</span>
      <button class="refreshImgBtn" data-id="${escapeHtml(gid)}" data-appid="${escapeHtml(g.appid)}" title="이미지 새로고침">🔄</button>
      <button class="delBtn" data-id="${escapeHtml(gid)}" title="삭제">✕</button>
    `;
    list.appendChild(el);
  });

  list.querySelectorAll('.refreshImgBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const gid = btn.getAttribute('data-id');
      const appid = btn.getAttribute('data-appid');
      btn.disabled = true;
      btn.textContent = '⏳';
      const realImg = await fetchRealHeaderImage(appid);
      if(realImg){
        db.ref('games/' + gid + '/img').set(realImg);
      }
      btn.disabled = false;
      btn.textContent = '🔄';
    });
  });

  list.querySelectorAll('.delBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      db.ref('games/' + btn.getAttribute('data-id')).remove();
    });
  });
}

// ---------- Firebase 실시간 구독 ----------
db.ref('games').on('value', (snapshot) => {
  GAMES = snapshot.val() || {};
  renderGallery();
  if(IS_ADMIN) renderAdminList();
});

// ---------- 게임 추가 ----------
async function addGame(){
  const by = document.getElementById('byInput').value.trim();
  const url = document.getElementById('urlInput').value.trim();
  const errEl = document.getElementById('addErr');
  errEl.style.display = 'none';

  if(!by){ errEl.textContent = '추천한 사람 이름을 입력해주세요.'; errEl.style.display = 'block'; return; }
  const appid = extractAppId(url);
  if(!appid){ errEl.textContent = 'store.steampowered.com/app/숫자/... 형태의 스팀 URL을 넣어주세요.'; errEl.style.display = 'block'; return; }

  const title = extractTitleFromUrl(url, appid);
  const addBtn = document.getElementById('addBtn');
  addBtn.disabled = true;
  addBtn.textContent = '이미지 확인 중...';

  const realImg = await fetchRealHeaderImage(appid);
  const img = realImg || steamHeaderImg(appid); // 실패하면 레거시 주소로 대체

  const newRef = db.ref('games').push();
  newRef.set({
    by, url, appid, title, img,
    addedAt: firebase.database.ServerValue.TIMESTAMP
  });

  document.getElementById('byInput').value = '';
  document.getElementById('urlInput').value = '';
  addBtn.disabled = false;
  addBtn.textContent = '추가';

  if(!realImg){
    errEl.textContent = '⚠️ 이미지 주소를 못 가져와서 예전 방식 주소로 저장했어요. 이미지가 안 뜨면 다시 추가해보세요.';
    errEl.style.display = 'block';
    errEl.style.color = 'var(--sub)';
  }
}

// ---------- 관리자 PIN 처리 ----------
function openPinModal(){
  document.getElementById('pinInput').value = '';
  document.getElementById('pinErr').style.display = 'none';
  document.getElementById('pinModalBg').classList.add('open');
  document.getElementById('pinInput').focus();
}

function closePinModal(){
  document.getElementById('pinModalBg').classList.remove('open');
}

function submitPin(){
  const val = document.getElementById('pinInput').value;
  if(val === ADMIN_PIN){
    IS_ADMIN = true;
    document.getElementById('adminCard').classList.add('show');
    document.getElementById('lockBtn').textContent = '🔓';
    document.getElementById('lockBtn').classList.add('unlocked');
    renderAdminList();
    closePinModal();
  } else {
    const err = document.getElementById('pinErr');
    err.textContent = 'PIN이 틀렸어요.';
    err.style.display = 'block';
  }
}

document.getElementById('lockBtn').addEventListener('click', () => {
  if(IS_ADMIN){
    IS_ADMIN = false;
    document.getElementById('adminCard').classList.remove('show');
    document.getElementById('lockBtn').textContent = '🔒';
    document.getElementById('lockBtn').classList.remove('unlocked');
  } else {
    openPinModal();
  }
});
document.getElementById('pinSubmitBtn').addEventListener('click', submitPin);
document.getElementById('pinInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') submitPin(); });
document.getElementById('pinCancelBtn').addEventListener('click', closePinModal);
document.getElementById('pinModalBg').addEventListener('click', (e) => { if(e.target.id === 'pinModalBg') closePinModal(); });

document.getElementById('addBtn').addEventListener('click', addGame);
document.getElementById('urlInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') addGame(); });
</script>
</body>
</html>
