<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEAM 게임 추천 리스트</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Pretendard:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#0a0e14;--panel:#12171f;--panel2:#161c26;--border:#20293a;--text:#e9eef5;
  --sub:#7d8ba0;--accent:#66c0f4;--accent2:#ff2d6f;--gold:#ffd60a;
  --font-display:'Rajdhani','Pretendard',sans-serif;--font-body:'Pretendard',system-ui,sans-serif;
  --bg-image:url("bg.gif");
}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px 100px;background-image:var(--bg-image),radial-gradient(ellipse 900px 500px at 50% -10%,rgba(102,192,244,.08),transparent 60%);background-color:var(--bg);background-size:cover,auto;background-position:center,center;background-attachment:fixed,scroll;background-repeat:no-repeat,no-repeat;color:var(--text);font-family:var(--font-body);min-height:100vh}
.wrap{max-width:900px;margin:0 auto}
.appHeader{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
h1{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0;display:flex;align-items:center;gap:9px}
.titleLogo{width:27px;height:27px;object-fit:contain;display:block}
.lockBtn{background:var(--panel2);border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:8px 14px;font-size:17px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.lockBtn .lockText{font-family:var(--font-display);font-size:9.5px;letter-spacing:.5px}
.lockBtn:hover{color:var(--accent);border-color:var(--accent)}.lockBtn.unlocked{color:var(--gold);border-color:var(--gold)}
.adminCard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:22px;display:none;position:relative;overflow:hidden}
.adminCard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--accent2))}
.adminCard.show{display:block}.adminCard h3{font-family:var(--font-display);font-size:15px;margin:0 0 14px;color:var(--gold)}
.adminCard h4{font-family:var(--font-display);font-size:12.5px;margin:18px 0 10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-top:1px solid #1a212e;padding-top:14px}
label{font-family:var(--font-display);font-size:11.5px;font-weight:600;letter-spacing:.5px;color:var(--sub);display:block;margin-bottom:6px;text-transform:uppercase}
input[type=text],input[type=password],input[type=number],input[type=url]{width:100%;background:#04060a;color:var(--accent);border:1px solid var(--border);border-radius:6px;font-size:13.5px;padding:10px 12px;font-family:'Rajdhani',monospace}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(102,192,244,.12)}
.formRow{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.formRow>div{flex:1;min-width:150px}
button{cursor:pointer;border:none;border-radius:6px;font-weight:700;font-size:13px;padding:10px 18px;font-family:var(--font-body)}
.btnPrimary{background:var(--accent);color:#04121c;font-weight:800}.btnDanger{background:rgba(255,45,111,.12);border:1px solid rgba(255,45,111,.45);color:var(--accent2)}
.btnGhost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}.btnGhost:hover{border-color:var(--accent);color:var(--accent)}
.err{color:var(--accent2);font-size:12px;margin-top:8px;display:none}.checkRow{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px}.checkRow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.adminColumns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.adminColumns .colHead{font-family:var(--font-display);font-size:11px;letter-spacing:.5px;color:var(--sub);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}.adminColumns .colHead .cnt{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:1px 7px;font-size:10.5px}
.adminListItem{display:flex;align-items:center;gap:8px;padding:11px 10px;border:1px solid transparent;border-bottom-color:#1a212e;font-size:12.5px;cursor:pointer;border-radius:7px;transition:.15s}.adminListItem:hover{background:var(--panel2);border-color:var(--border)}.adminListItem .aTitle{flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adminListItem.played .aTitle{color:var(--sub);text-decoration:line-through}.adminListItem .arrow{color:var(--sub)}
@media(max-width:560px){.adminColumns{grid-template-columns:1fr}}
.modalBg{display:none;position:fixed;inset:0;background:rgba(4,6,10,.84);z-index:9999;align-items:center;justify-content:center;padding:20px;overflow:auto}.modalBg.open{display:flex}
.modalBox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:720px;width:100%;max-height:92vh;overflow:auto}.smallModal{max-width:360px}
.modalBox h3{font-family:var(--font-display);font-size:17px;margin:0 0 16px}.modalTitleRow{display:flex;justify-content:space-between;gap:10px;align-items:center}.closeX{background:none;color:var(--sub);font-size:20px;padding:2px 7px}
.managePreview{display:flex;gap:14px;padding-bottom:15px;margin-bottom:16px;border-bottom:1px solid #1a212e}.managePreview img{width:170px;aspect-ratio:460/215;object-fit:cover;border-radius:7px;background:#0d1119}.managePreviewInfo{min-width:0;flex:1}.managePreviewTitle{font-weight:800;font-size:16px;margin-bottom:6px;word-break:break-word}.managePreviewSub{font-size:11px;color:var(--sub);line-height:1.7}
.manageActions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.manageActions button{padding:9px 12px}
.sectionTitle{font-family:var(--font-display);font-size:12px;color:var(--gold);letter-spacing:.5px;margin:16px 0 9px;padding-top:14px;border-top:1px solid #1a212e}
.filterRow{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.filterRow input{flex:2;min-width:160px}.filterRow select{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:10px 12px;font-size:13px}
.gameGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.viewTabs{display:flex;gap:8px;margin:0 0 14px;border-bottom:1px solid var(--border);padding-bottom:12px}.viewTab{background:transparent;color:var(--sub);border:1px solid transparent;padding:8px 12px}.viewTab.active{background:var(--panel2);color:var(--accent);border-color:var(--border)}.viewPanel[hidden]{display:none}.steamBadges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.steamBadge{font-family:var(--font-display);font-size:10.5px;font-weight:700;border-radius:4px;padding:3px 6px;background:#1b2533;border:1px solid #2b3b50;color:#b9dfff}.steamBadge.meta{color:var(--gold);border-color:rgba(255,214,10,.36);background:rgba(255,214,10,.08)}.eventLink{display:block;background:linear-gradient(120deg,#1d3045,#17202d);border:1px solid #2a4662;color:var(--text);padding:14px;border-radius:8px;text-decoration:none;margin:0 0 16px;font-size:13px}.eventLink strong{color:var(--accent);display:block;margin-bottom:3px}.saleStatus{font-size:12px;color:var(--sub);margin:-5px 0 14px}.saleCard .recBadge{color:#fff;background:rgba(255,45,111,.86);border-color:rgba(255,255,255,.25)}
.gameCard{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--text);display:block;isolation:isolate;transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .28s ease}
/* 테두리에만 딱 붙는 그라데이션 링 — 회전 없이 페이드인만 */
.gameCard::after{content:'';position:absolute;inset:0;border-radius:10px;padding:2px;pointer-events:none;z-index:1;opacity:0;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--gold));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transition:opacity .2s ease}
.gameCard .thumb{transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .35s ease}
.gameCard:hover{transform:translateY(-4px)}
.gameCard:hover::after{opacity:1}
.gameCard:hover .thumb{transform:scale(1.04);filter:brightness(1.08) saturate(1.1)}
.gameCard.played{opacity:1}.gameCard .playedBadge{position:absolute;top:8px;right:8px;background:var(--accent2);color:#fff;font-size:13px;font-weight:800;padding:4px 10px;border-radius:5px;font-family:var(--font-display);letter-spacing:.5px;z-index:2}
.gameCard .thumb{width:100%;aspect-ratio:460/215;object-fit:cover;background:#0d1119;display:block}.gameCard .info{padding:12px 14px}.gameCard .gTitle{font-weight:700;font-size:13.5px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gameCard .recBadge{position:absolute;top:8px;left:8px;background:rgba(4,6,10,.75);color:var(--accent);font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:6px;z-index:2;backdrop-filter:blur(2px);border:1px solid rgba(102,192,244,.4)}
.gameCard .genreTags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}.gameCard .genreTag{font-size:9.5px;background:var(--panel2);border:1px solid var(--border);color:var(--sub);padding:2px 6px;border-radius:4px;font-family:var(--font-display)}
.gameCard .priceLine{margin-top:8px;padding-top:8px;border-top:1px solid #1a212e;font-family:var(--font-display);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.priceOrig{font-size:11.5px;color:var(--sub);text-decoration:line-through}.priceFinal{font-size:14px;font-weight:700;color:var(--gold)}.priceFree{font-size:13px;font-weight:700;color:var(--accent)}.priceEnd{font-size:10.5px;color:var(--accent2)}.discountBadge{background:var(--accent2);color:#fff;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:4px}
.emptyMsg{text-align:center;color:var(--sub);font-size:13.5px;padding:50px 0;grid-column:1/-1}.verTag{font-size:10px;color:#3a4456;margin-bottom:18px;font-family:var(--font-display)}
#scrollTopBtn{position:fixed;right:18px;bottom:24px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#04121c;font-size:18px;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(102,192,244,.35);z-index:500;padding:0;line-height:1}#scrollTopBtn.show{display:flex}
@media(max-width:600px){.managePreview{flex-direction:column}.managePreview img{width:100%}.modalBox{padding:17px}.manageActions button{flex:1}}
</style>
</head>

/*

 2) Steam 페이지의 /genre/ 링크
 3) 둘 다 없을 때만 SteamSpy

async function fetchRealDetails(appid){
  const api='https://store.steampowered.com/api/appdetails?appids='+appid+'&cc=kr&l=korean';
  const page='https://store.steampowered.com/app/'+appid+'/?cc=kr&l=korean';

  const apiTasks=[
    ()=>fetchJSON(api).then(j=>j?.[appid]?.success?j[appid].data:null),
    ()=>fetchJSON('https://api.allorigins.win/raw?url='+encodeURIComponent(api)).then(j=>j?.[appid]?.success?j[appid].data:null),
    ()=>fetchJSON('https://api.allorigins.win/get?url='+encodeURIComponent(api)).then(j=>{
      const x=typeof j?.contents==='string'?JSON.parse(j.contents):j;
      return x?.[appid]?.success?x[appid].data:null
    }),
    ()=>fetchJSON('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(api)).then(j=>j?.[appid]?.success?j[appid].data:null),
    ()=>fetchJSON('https://corsproxy.io/?'+encodeURIComponent(api)).then(j=>j?.[appid]?.success?j[appid].data:null)
  ];
  const pageTasks=[
    ()=>fetchText('https://api.allorigins.win/raw?url='+encodeURIComponent(page)).then(parseSteamPage),
    ()=>fetchText('https://api.allorigins.win/get?url='+encodeURIComponent(page)).then(parseSteamPage),
    ()=>fetchText('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(page)).then(parseSteamPage),
    ()=>fetchText('https://corsproxy.io/?'+encodeURIComponent(page)).then(parseSteamPage)
  ];
  const spyTask=()=>fetchJSON('https://steamspy.com/api.php?request=appdetails&appid='+appid,7000)
    .then(d=>d?{name:d.name||'',genres:limitGenres(genresFromText(d.genre)).map(description=>({description}))}:null);

  let apiResults=[],pageResults=[],spyResults=[];
  for(let round=0;round<2;round++){
    const [apis,pages,spies]=await Promise.all([collectAll(apiTasks),collectAll(pageTasks),collectAll([spyTask])]);
    apiResults.push(...apis); pageResults.push(...pages); spyResults.push(...spies);

    const official=limitGenres(apiResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
    const pageGenres=limitGenres(pageResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
    const spyGenres=limitGenres(spyResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
    const genres=official.length?official:(pageGenres.length?pageGenres:spyGenres);
    const name=apiResults.map(x=>x&&x.name).find(Boolean)||pageResults.map(x=>x&&x.name).find(Boolean)||spyResults.map(x=>x&&x.name).find(Boolean)||'';
    const image=apiResults.map(x=>x&&x.header_image).find(Boolean)||pageResults.map(x=>x&&x.header_image).find(Boolean)||'';

    if(image&&genres.length)return {name,header_image:image,genres:genres.map(description=>({description})),metacritic:apiResults.map(x=>x?.metacritic?.score).find(x=>Number.isFinite(Number(x)))||null,reviewSummary:await fetchReviewSummary(appid)};
    if(round===0)await new Promise(r=>setTimeout(r,700));
  }
  const official=limitGenres(apiResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
  const pageGenres=limitGenres(pageResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
  const spyGenres=limitGenres(spyResults.flatMap(x=>Array.isArray(x&&x.genres)?x.genres:[]));
  const genres=official.length?official:(pageGenres.length?pageGenres:spyGenres);
  const name=apiResults.map(x=>x&&x.name).find(Boolean)||pageResults.map(x=>x&&x.name).find(Boolean)||spyResults.map(x=>x&&x.name).find(Boolean)||'';
  const image=apiResults.map(x=>x&&x.header_image).find(Boolean)||pageResults.map(x=>x&&x.header_image).find(Boolean)||steamHeaderImg(appid);
  return {name,header_image:image,genres:genres.map(description=>({description})),metacritic:apiResults.map(x=>x?.metacritic?.score).find(x=>Number.isFinite(Number(x)))||null,reviewSummary:await fetchReviewSummary(appid)}
}

       err.textContent=retryGenres
         ? '✓ 이미지 및 장르 정보를 정상적으로 가져왔습니다.'
         : '⚠️ 이미지는 등록됐지만 Steam 장르 응답이 지연되고 있습니다. 관리자 모드의 정보 새로고침으로 다시 확인할 수 있습니다.';
       err.style.color=retryGenres?'var(--accent)':'var(--sub)';
       err.style.display='block';
     }catch(e){}
   },1200);
 }else{
   err.textContent='✓ 이미지 및 장르 정보를 정상적으로 가져왔습니다.';
   err.style.color='var(--accent)';
   err.style.display='block';
   setTimeout(()=>err.style.display='none',2200);
 }
}
document.getElementById('addBtn').addEventListener('click',addGame);document.getElementById('urlInput').addEventListener('keydown',e=>{if(e.key==='Enter')addGame()});

function showManageMain(){
 document.getElementById('manageMainView').style.display='block';
 document.getElementById('managePriceView').style.display='none';
 document.getElementById('manageModalTitle').textContent='🎮 게임 관리';
}
function openPriceModal(gid){
 CURRENT_EDIT_ID=gid;
 const p=(GAMES[gid]&&GAMES[gid].price)||{};
 document.getElementById('editFreeCheck').checked=!!p.free;
 document.getElementById('editPriceSection').style.display=p.free?'none':'block';
 document.getElementById('editPriceBaseInput').value=p.base||'';
 document.getElementById('editOnSaleCheck').checked=!!p.onSale;
 document.getElementById('editSaleFields').style.display=p.onSale?'flex':'none';
 document.getElementById('editPriceOrigInput').value=p.original||'';
 document.getElementById('editPriceNowInput').value=p.current||'';
 document.getElementById('editPriceEndInput').value=p.endDate||'';

 document.getElementById('manageMainView').style.display='none';
 document.getElementById('managePriceView').style.display='block';
 document.getElementById('manageModalTitle').textContent='💰 가격 수정';
}
function closePriceModal(){
 CURRENT_EDIT_ID=null;
 showManageMain();
}
document.getElementById('editFreeCheck').addEventListener('change',e=>{
 document.getElementById('editPriceSection').style.display=e.target.checked?'none':'block'
});
document.getElementById('editOnSaleCheck').addEventListener('change',e=>{
 document.getElementById('editSaleFields').style.display=e.target.checked?'flex':'none'
});
document.getElementById('priceSaveBtn').addEventListener('click',async()=>{
 if(!CURRENT_EDIT_ID)return;
 const free=document.getElementById('editFreeCheck').checked;
 const sale=document.getElementById('editOnSaleCheck').checked;
 const price=free
   ? {free:true}
   : sale
     ? {
         onSale:true,
         original:+document.getElementById('editPriceOrigInput').value||0,
         current:+document.getElementById('editPriceNowInput').value||0,
         endDate:document.getElementById('editPriceEndInput').value.trim()
       }
     : {onSale:false,base:+document.getElementById('editPriceBaseInput').value||0};

 await db.ref('games/'+CURRENT_EDIT_ID+'/price').set(price);
 closePriceModal();
});
document.getElementById('priceCancelBtn').addEventListener('click',closePriceModal);

function openManageModal(gid){
 CURRENT_MANAGE_ID=gid;
 CURRENT_EDIT_ID=null;
 const g=GAMES[gid];
 if(!g)return;
 showManageMain();
 document.getElementById('managePreviewImg').src=g.img||steamHeaderImg(g.appid);document.getElementById('managePreviewTitle').textContent=g.title||'';document.getElementById('managePreviewInfo').innerHTML='APP ID: '+escapeHtml(g.appid||'-')+'<br>장르: '+escapeHtml(g.genres||'정보 없음')+'<br>상태: '+(g.played?'플레이 완료':'아직 안 함');
 document.getElementById('manageTitleInput').value=g.title||'';document.getElementById('manageByInput').value=g.by||'';document.getElementById('manageUrlInput').value=g.url||'';document.getElementById('manageGenresInput').value=g.genres||'';document.getElementById('managePlayedBtn').textContent=g.played?'↩ 플레이 미완료로 변경':'✓ 플레이 완료로 변경';document.getElementById('manageErr').style.display='none';document.getElementById('manageModalBg').classList.add('open');
}
function closeManageModal(){document.getElementById('manageModalBg').classList.remove('open');CURRENT_MANAGE_ID=null;CURRENT_EDIT_ID=null;showManageMain()}
document.getElementById('managePlayedBtn').addEventListener('click',async()=>{if(!CURRENT_MANAGE_ID)return;const g=GAMES[CURRENT_MANAGE_ID];await db.ref('games/'+CURRENT_MANAGE_ID+'/played').set(!g.played);setTimeout(()=>openManageModal(CURRENT_MANAGE_ID),50)});
document.getElementById('managePriceBtn').addEventListener('click',()=>{if(CURRENT_MANAGE_ID)openPriceModal(CURRENT_MANAGE_ID)});
document.getElementById('manageRefreshBtn').addEventListener('click',async()=>{if(!CURRENT_MANAGE_ID)return;const btn=document.getElementById('manageRefreshBtn');const ok=await refreshGameMetadata(CURRENT_MANAGE_ID,btn);const err=document.getElementById('manageErr');err.textContent=ok?'✓ 이미지·장르·게임 정보를 새로고침했습니다.':'⚠️ Steam 정보를 가져오지 못했습니다. 잠시 후 다시 시도해주세요.';err.style.color=ok?'var(--accent)':'var(--accent2)';err.style.display='block';setTimeout(()=>openManageModal(CURRENT_MANAGE_ID),80)});
document.getElementById('manageOpenBtn').addEventListener('click',()=>{const g=GAMES[CURRENT_MANAGE_ID];if(g&&g.url)window.open(g.url,'_blank','noopener')});
document.getElementById('manageSaveBtn').addEventListener('click',async()=>{if(!CURRENT_MANAGE_ID)return;const url=document.getElementById('manageUrlInput').value.trim(),appid=extractAppId(url)||GAMES[CURRENT_MANAGE_ID].appid;await db.ref('games/'+CURRENT_MANAGE_ID).update({title:document.getElementById('manageTitleInput').value.trim(),by:document.getElementById('manageByInput').value.trim(),url,appid,genres:document.getElementById('manageGenresInput').value.trim()});const err=document.getElementById('manageErr');err.textContent='✓ 기본 정보가 저장되었습니다.';err.style.color='var(--accent)';err.style.display='block'});
document.getElementById('manageDeleteBtn').addEventListener('click',async()=>{if(!CURRENT_MANAGE_ID)return;if(confirm('정말 이 게임을 삭제하시겠습니까?')){await db.ref('games/'+CURRENT_MANAGE_ID).remove();closeManageModal()}});

function openPinModal(){document.getElementById('pinInput').value='';document.getElementById('pinErr').style.display='none';document.getElementById('pinModalBg').classList.add('open');document.getElementById('pinInput').focus()}
function closePinModal(){document.getElementById('pinModalBg').classList.remove('open')}
function submitPin(){if(document.getElementById('pinInput').value===ADMIN_PIN){IS_ADMIN=true;document.getElementById('adminCard').classList.add('show');document.getElementById('lockIcon').textContent='🔓';document.getElementById('lockBtn').classList.add('unlocked');closePinModal()}else{const e=document.getElementById('pinErr');e.textContent='PIN이 틀렸어요.';e.style.display='block'}}
document.getElementById('lockBtn').addEventListener('click',()=>{if(IS_ADMIN){IS_ADMIN=false;document.getElementById('adminCard').classList.remove('show');document.getElementById('lockIcon').textContent='🔒';document.getElementById('lockBtn').classList.remove('unlocked')}else openPinModal()});document.getElementById('pinSubmitBtn').addEventListener('click',submitPin);document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitPin()});document.getElementById('pinCancelBtn').addEventListener('click',closePinModal);
document.querySelectorAll('.modalBg').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg){bg.classList.remove('open');if(bg.id==='manageModalBg'){CURRENT_MANAGE_ID=null;CURRENT_EDIT_ID=null;showManageMain()}}}));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{
 const bg=document.getElementById(b.dataset.close);
 bg.classList.remove('open');
 if(bg.id==='manageModalBg'){CURRENT_MANAGE_ID=null;CURRENT_EDIT_ID=null;showManageMain()}
}));
document.getElementById('searchInput').addEventListener('input',e=>{SEARCH_QUERY=e.target.value.trim();renderGallery()});document.getElementById('genreFilter').addEventListener('change',e=>{GENRE_FILTER=e.target.value;renderGallery()});
const topBtn=document.getElementById('scrollTopBtn');window.addEventListener('scroll',()=>topBtn.classList.toggle('show',window.scrollY>400));topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
</script>
</body>
</html>
